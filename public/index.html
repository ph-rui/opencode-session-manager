<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode 会话管理器</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">OpenCode 会话管理器</div>
    <div id="status" class="status">连接中…</div>
  </header>

  <main>
    <aside id="filters">
      <label>搜索
        <input id="search" type="search" placeholder="标题关键字…" autocomplete="off">
      </label>
      <label>工程目录
        <select id="dirFilter"><option value="">全部</option></select>
      </label>
      <label>排序
        <select id="order">
          <option value="desc">最近更新</option>
          <option value="asc">最早更新</option>
        </select>
      </label>
      <button id="refresh">刷新</button>
      <div class="hint">共 <span id="count">0</span> 个会话</div>
    </aside>

    <div class="resizer" id="resizer-left" title="拖动调整宽度 · 双击复位"></div>

    <section id="listpane">
      <table id="list">
        <thead>
          <tr>
            <th>标题</th>
            <th>工程目录</th>
            <th>更新</th>
            <th>Tokens</th>
            <th>Cost</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="loadMore" hidden>加载更多…</button>
    </section>

    <div class="resizer" id="resizer-mid" title="拖动调整宽度 · 双击复位"></div>

    <section id="chatpane">
      <div id="chatHeader">
        <div class="chline">
          <span id="chatTitle">未选择会话</span>
          <span id="chatState" class="state"></span>
        </div>
        <div id="chatMeta" class="meta"></div>
        <button id="older" hidden>加载更旧消息</button>
      </div>
      <div id="messages"></div>
      <div id="asks" hidden></div>
      <div id="inbox" hidden></div>
      <div id="composer">
        <div id="ctoolbar" hidden>
          <label class="ctl" title="当前会话使用的智能体">
            <span>智能体</span>
            <select id="agentSel"><option value="">默认</option></select>
          </label>
          <label class="ctl" title="当前会话使用的模型">
            <span>模型</span>
            <select id="modelSel"><option value="">默认</option></select>
          </label>
          <label class="ctl" id="variantWrap" hidden title="模型变体 / 推理档位">
            <span>变体</span>
            <select id="variantSel"></select>
          </label>
          <span class="ctl-spacer"></span>
          <div id="delivery" class="seg" hidden title="运行中消息的投递方式">
            <button type="button" data-delivery="queue">排队</button>
            <button type="button" data-delivery="steer">插话</button>
          </div>
          <button type="button" id="interrupt" class="chip danger" hidden title="中断当前正在执行的回合">■ 中断</button>
        </div>
        <div class="cinput">
          <textarea id="input" rows="2" placeholder="输入消息,Enter 发送(Shift+Enter 换行)"></textarea>
          <button id="send">发送</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
