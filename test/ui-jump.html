<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>jump-to-latest unit</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header id="topbar"><div class="brand">t</div>
    <label class="f"><span>搜索</span><input id="search"></label>
    <label class="f"><span>工程目录</span><select id="dirFilter"></select></label>
    <label class="f"><span>排序</span><select id="order"><option value="desc">最近更新</option><option value="asc">最早更新</option></select></label>
    <div class="lbtools"><button id="btnNew">+ 新建</button><button id="btnImport">导入</button><button id="refresh">刷新</button></div>
    <label class="chk"><input type="checkbox" id="showArchived"></label>
    <span id="count"></span><span id="archivedCount"></span>
    <div id="status" class="status"></div>
  </header>
  <main>
    <section id="listpane"><table id="list"><tbody></tbody></table><button id="loadMore" hidden></button></section>
    <div class="resizer" id="resizer-mid">
      <button id="btnList" class="handle" type="button" aria-expanded="true" aria-label="收起会话列表">
        <span class="ao" aria-hidden="true">‹</span><span class="ac" aria-hidden="true">›</span>
      </button>
    </div>
    <section id="chatpane">
      <div id="chatHeader">
        <div class="chline"><span id="chatTitle"></span><span id="chatState"></span></div>
        <div id="chatMeta"></div>
        <div id="chatOps" hidden>
          <button type="button" id="opExport"></button><button type="button" id="opTui"></button><button type="button" id="opArchive"></button>
        </div>
        <button id="older" hidden></button>
      </div>
      <div id="messages"><button type="button" id="jumpLatest" class="chip" hidden>跳到最新 ↓</button><div id="msgState" class="msgstate" hidden><span id="msgStateText"></span><button type="button" id="msRetry" class="chip" hidden>重试</button></div></div>
      <div id="asks" hidden></div><div id="inbox" hidden></div>
      <div id="composer">
        <div id="ctoolbar" hidden>
          <label class="ctl"><span>智能体</span><select id="agentSel"><option value=""></option></select></label>
          <label class="ctl"><span>模型</span><select id="modelSel"><option value=""></option></select></label>
          <label class="ctl" id="variantWrap" hidden><span>变体</span><select id="variantSel"></select></label>
          <span class="ctl-spacer"></span>
          <div id="delivery" class="seg" hidden><button type="button" data-delivery="queue">排队</button><button type="button" data-delivery="steer">插话</button></div>
          <button type="button" id="interrupt" hidden>■ 中断</button>
        </div>
        <div class="cinput"><textarea id="input"></textarea><button id="send"></button></div>
      </div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <pre id="results"></pre>

  <script>
    /* 屏蔽 app.js 的自动 init(本页自己控制接线时机) */
    var __add = document.addEventListener.bind(document);
    document.addEventListener = function (t, fn, o) {
      if (t === 'DOMContentLoaded') return;
      return __add(t, fn, o);
    };

    var SESSIONS = [
      { id: 'ses_a', title: '会话 A', projectID: 'pj1', time: { created: 1, updated: 5 },
        tokens: { input: 10, output: 5 }, cost: 0, location: { directory: '/proj/a' } },
    ];
    var AGENTS = [{ id: 'build', name: 'Build', mode: 'primary', hidden: false }];
    var MODELS = [{ providerID: 'company', modelID: 'deepseek-v4-flash', name: 'Flash', enabled: true, variants: [] }];

    window.SERVER = {
      'ses_a': [
        { id: 'msg_a1', type: 'user', time: { created: 100 }, text: '会话 A 的第一问' },
      ],
    };

    /* 撑出滚动条:不然「在不在底部」这个判定根本无从谈起 */
    window.SERVER['ses_long'] = (function () {
      var arr = [];
      for (var i = 0; i < 60; i++) {
        arr.push({ id: 'msg_l' + i, type: 'user', time: { created: 1000 + i },
          text: '第 ' + i + ' 条消息:用来把对话区撑到能滚动。' });
      }
      return arr;
    })();

    window.__realFetch = window.fetch.bind(window);
    window.calls = [];
    var json = function (obj) { return { ok: true, status: 200, text: async function () { return JSON.stringify(obj); } }; };

    window.fetch = async function (url, opts) {
      var u = String(url);
      var method = (opts && opts.method) || 'GET';
      window.calls.push({ url: u, method: method, body: (opts && opts.body) || null });
      var m = u.match(/^\/api\/session\/([^/?]+)\/message/);
      if (m) {
        var sid = decodeURIComponent(m[1]);
        /* 三个坏开关(默认都不开,只为 §8.34 那组用):
         *   window.GATE   = promise,卡住这次拉取(用来观察「正在加载消息…」露没露)
         *   window.FAIL   = { sid: 次数 } 打回几次(HTTP 500)
         *   window.BROKEN = { sid: 次数 } 回 200 但正文是半截(JSON.parse 会失败)
         *   window.SHAPE  = { sid: 次数 } 回 200 合法 JSON,但没有 data 数组 */
        if (window.GATE) await window.GATE;
        if (window.FAIL && window.FAIL[sid] > 0) {
          window.FAIL[sid]--;
          return { ok: false, status: 500, text: async function () { return JSON.stringify({ message: '模拟打回' }); } };
        }
        if (window.BROKEN && window.BROKEN[sid] > 0) {
          window.BROKEN[sid]--;
          return { ok: true, status: 200, text: async function () { return '{ "data": [ {'; } };
        }
        if (window.SHAPE && window.SHAPE[sid] > 0) {
          window.SHAPE[sid]--;
          return json({ error: 'no data' });
        }
        return json({ data: window.SERVER[sid] || [], cursor: {} });
      }
      if (u.indexOf('/api/session/active') === 0) return json({ data: {} });
      if (u.indexOf('/api/agent') === 0) return json({ data: AGENTS });
      if (u.indexOf('/api/model') === 0) return json({ data: MODELS });
      if (/^\/api\/session\/[^/?]+\/(inbox|form|permission)/.test(u)) return json({ data: [] });
      if (u.indexOf('/api/session?') === 0) return json({ data: SESSIONS, cursor: {} });
      return json({ data: [] });
    };
    window.EventSource = class { constructor() {} close() {} };
    window.setInterval = function () { return 0; };
    /* 本页要跑「浏览器真的派发了 scroll 事件」那条路径:把真定时器留一份出来 */
    window.__realSetTimeout = window.setTimeout.bind(window);
    window.setTimeout = function () { return 0; };
    window.clearTimeout = function () {};
  </script>
  <script src="/app.js"></script>
  <script>
  (async function () {
    var post = function (b) { try { window.__realFetch('/result', { method: 'POST', body: b }); } catch (_) {} };
    var out = [];
    var T = function (name, cond, extra) {
      out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : ' | got=' + JSON.stringify(extra)));
    };
    var q = function (s) { return document.querySelector(s); };
    var box = q('#messages');
    var btn = q('#jumpLatest');
    /* #msgState(拉消息的状态行,§8.34)跟 #jumpLatest 一样:节点在 index.html 里,
       selectSession/clearSelection 会把 #messages 清空,所以引用得在【清空之前】就抓下来,
       之后靠 paintMsgState() 自己搬回末尾。 */
    var stateEl = q('#msgState');
    var stateText = q('#msgStateText');
    var retryBtn = q('#msRetry');
    setupMsgState();
    /* 等真定时器一小会儿:scroll 事件是异步派发的,要给它落地的时间 */
    var tick = function () { return new Promise(function (r) { window.__realSetTimeout(r, 40); }); };
    /* 上面那句「等 40ms 给它落地」常态够用,但机器一忙(全量回归连着跑十几套时实测有过一次)
     * 不够,于是「(前置)」先挂 —— 前置不是被测对象,改成「等到位再断言」:真正要断言的
     * 句子一个字没松,等满 25 拍还没到就照样挂(真有 bug 一样抓得住)。 */
    var waitUntil = async function (pred) {
      for (var wi = 0; wi < 25 && !pred(); wi++) await tick();
      return pred();
    };
    var maxTop = function () { return box.scrollHeight - box.clientHeight; };
    var settle = async function (pred, tries) {
      for (var i = 0; i < (tries || 300); i++) {
        if (pred()) return true;
        await Promise.resolve();
      }
      return pred();
    };

    try {
      /* ============ 1. 形状 ============ */
      T('#jumpLatest 在页面里', !!btn);
      T('它是 #messages 的子元素(只有滚动容器【内部】的 sticky 才钉得住)',
        btn.parentElement === box);
      T('带 .chip(窄屏自动拿到 44px 命中区)', btn.classList.contains('chip'));
      T('是 button[type=button]', btn.tagName === 'BUTTON' && btn.getAttribute('type') === 'button');
      T('默认就是收起来的', btn.hidden === true);
      T('文案是「跳到最新 ↓」', btn.textContent.trim() === '跳到最新 ↓', btn.textContent);

      /* ============ 2. 接线 ============ */
      setupJumpLatest();
      T('接线后打了标记(wired)', btn.dataset.wired === '1');
      T('没选中会话时是收起的', btn.hidden === true);
      var addCalls = 0;
      var origAdd = btn.addEventListener.bind(btn);
      btn.addEventListener = function () { addCalls++; return origAdd.apply(null, arguments); };
      setupJumpLatest();
      btn.addEventListener = origAdd;
      T('重复接线不再挂监听(setup 会被反复调用)', addCalls === 0, addCalls);
      btn.hidden = false;
      setupJumpLatest();
      T('重复接线只按当前状态重画(没选中 → 又收起来)', btn.hidden === true);

      /* ============ 3. 判定:在不在底部 ============ */
      await selectSession('ses_long');
      T('长会话渲染出来了', box.textContent.indexOf('第 59 条消息') >= 0);
      T('长会话确实能滚动(否则这组测试没意义)', maxTop() > 100, maxTop());
      T('刚选中(落到底部)时按钮收起', btn.hidden === true);

      /* 往上翻 → 按钮露出来。不手动派发 scroll:走浏览器真派发的那条路 */
      box.scrollTop = Math.round(maxTop() / 2);
      await tick();
      T('往上翻 → 按钮露出来', btn.hidden === false);
      // 入口只有 #messages 的 scroll 监听:手工把 hidden 改错,派发一次就该被纠正回来
      btn.hidden = true;
      box.dispatchEvent(new Event('scroll'));
      T('滚动监听挂在 #messages 上(派发一次 scroll 就重算)', btn.hidden === false);

      /* 露出来的时候得真贴在消息区右下角(sticky 生效的证据) */
      var br = btn.getBoundingClientRect();
      var mr = box.getBoundingClientRect();
      T('浮在消息区下沿之内(没被内容顶出去)', br.bottom <= mr.bottom + 1 && br.bottom >= mr.bottom - 24,
        br.bottom + ' vs ' + mr.bottom);
      T('贴在右侧', br.right > mr.left + mr.width / 2 && br.right <= mr.right + 1,
        br.right + ' in ' + mr.left + '..' + mr.right);
      T('右沿贴住消息区内边距(<40px 缝)', mr.right - br.right < 40, mr.right - br.right);
      T('浮在消息上面(有自己的阴影,不是普通行内文本)', getComputedStyle(btn).boxShadow !== 'none');

      box.scrollTop = box.scrollHeight;
      await tick();
      T('滚回底部 → 又收起来', btn.hidden === true);

      await selectSession('ses_a');
      T('短会话(压根不需要滚动)→ 收起', btn.hidden === true);

      clearSelection();
      T('没选中会话 → 收起', btn.hidden === true);
      T('清空后按钮还在 DOM 里(没被 innerHTML 一起抹掉)', btn.isConnected && btn.parentElement === box);
      T('清空后对话区没有残留消息', box.querySelectorAll('.msg').length === 0,
        box.querySelectorAll('.msg').length);

      /* 「加载更旧消息」也跟着选中会话走:只清 store.messages 的话这一格会一直露在头部
         (没选中会话时点了也没用),游标还会把上一个会话的页码带进下一个会话。 */
      store.msgOlderCursor = 'cur-old';
      q('#older').hidden = false;
      clearSelection();
      T('清掉选中后「加载更旧消息」跟着收起', q('#older').hidden === true);
      T('清掉选中后分页游标也清掉', !store.msgOlderCursor, String(store.msgOlderCursor));

      T('在底部的口径:离底 79px 算在底部', atBottom({ scrollHeight: 1000, scrollTop: 921, clientHeight: 0 }) === true);
      T('离底 80px 就不算了(留一点余量给人往回看)', atBottom({ scrollHeight: 1000, scrollTop: 920, clientHeight: 0 }) === false);
      T('口径只有一处:自动跟随与按钮共用 BOTTOM_SLACK', BOTTOM_SLACK === 80, BOTTOM_SLACK);

      /* ============ 4. 新内容到达 ============ */
      await selectSession('ses_long');
      box.scrollTop = Math.round(maxTop() / 2);
      await waitUntil(function () { return btn.hidden === false; });
      T('(前置)此刻按钮露着', btn.hidden === false);
      var before = box.scrollTop;
      window.SERVER['ses_long'].push({ id: 'msg_lnew', type: 'user', time: { created: 9999 }, text: '新来的一条' });
      await loadMessages();
      T('往上翻着时新内容进来 → 按钮仍露着', btn.hidden === false);
      T('而且没把人拽到底部(自动跟随让路)', box.scrollTop === before, box.scrollTop + ' vs ' + before);
      T('新内容也真的渲染出来了', box.textContent.indexOf('新来的一条') >= 0);

      box.scrollTop = box.scrollHeight;
      await tick();
      before = box.scrollTop;
      window.SERVER['ses_long'].push({ id: 'msg_lnew2', type: 'user', time: { created: 10000 }, text: '又新来的一条' });
      await loadMessages();
      await tick();
      T('就在底部时新内容进来 → 自动跟随(仍在底部)', maxTop() - box.scrollTop < 2, box.scrollTop + '/' + maxTop());
      T('自动跟随时按钮不冒出来', btn.hidden === true);

      /* ============ 4b. 什么才算「用户往上滚」 ============
       * 「贴不贴底」是【用户意图】,不是一次几何测量。容器变矮(状态条出现 / 底板展开 /
       * #asks 弹出 / 软键盘顶起)与内容变长都会把「离底还有多远」撑大,可那都不是用户
       * 往回翻 —— 老写法直接采信那一次几何读数,于是「明明一直贴在底,忽然就不跟了,
       * 得点一下跳到最新」。判据只认两条:离底够近,或者 scrollTop 比上次记下的变小了。 */
      pinBottom(box);
      T('pinBottom() 记下贴底时的 scrollTop(下次才分得清用户往上滚)',
        Math.abs(box.scrollTop - maxTop()) < 2 && store.lastTop === box.scrollTop,
        box.scrollTop + '/' + maxTop() + '/' + store.lastTop);

      var ch0 = box.clientHeight;
      box.style.maxHeight = Math.max(60, ch0 - 160) + 'px'; // 等价于容器变矮 160px
      T('(前置)容器确实矮了、离底也确实过了 BOTTOM_SLACK',
        box.clientHeight <= ch0 - 160 &&
          box.scrollHeight - box.scrollTop - box.clientHeight > BOTTOM_SLACK,
        box.clientHeight + '/' + (box.scrollHeight - box.scrollTop - box.clientHeight));
      updateJumpLatest();
      T('容器变矮(scrollTop 没往回走)→ 不算用户往上滚,跟随保持', store.nearBottom === true && btn.hidden === true);

      box.scrollTop = Math.max(0, box.scrollTop - 200);
      updateJumpLatest();
      T('scrollTop 往回走了 200px → 这就是用户往上滚,让路', store.nearBottom === false && btn.hidden === false);
      box.style.maxHeight = '';
      box.scrollTop = box.scrollHeight;
      await tick();
      T('(复位)回到底部 → 跟随回来', store.nearBottom === true && btn.hidden === true,
        store.nearBottom + '/' + btn.hidden);

      /* 容器变矮那一刻就要把底重新贴住(ResizeObserver),别等下一次渲染 ——
       * 一条消息都不再来的话,底部就永远被顶出可视区了。 */
      box.style.maxHeight = Math.max(60, box.clientHeight - 160) + 'px';
      var pinnedAfterResize = false;
      for (var ri = 0; ri < 8 && !pinnedAfterResize; ri++) {
        await tick();
        pinnedAfterResize = maxTop() - box.scrollTop < 2;
      }
      T('容器变矮后底部被当场重新贴住(不用等下一次渲染)', pinnedAfterResize, box.scrollTop + '/' + maxTop());
      box.style.maxHeight = '';
      box.scrollTop = box.scrollHeight;
      await tick();

      /* 往上翻着的时候,容器变矮也不许把人拽走 */
      box.scrollTop = Math.max(0, maxTop() - 400);
      await waitUntil(function () { return store.nearBottom === false; });
      var heldAt = box.scrollTop;
      T('(前置)此刻已让路', store.nearBottom === false);
      box.style.maxHeight = Math.max(60, box.clientHeight - 160) + 'px';
      await tick();
      T('让路期间容器变矮 → 一动不动', box.scrollTop === heldAt, box.scrollTop + ' vs ' + heldAt);
      box.style.maxHeight = '';
      box.scrollTop = box.scrollHeight;
      await tick();
      T('(复位)回到底部', maxTop() - box.scrollTop < 2 && store.nearBottom === true);

      /* 增量重绘(paintLiveDelta / paintCompactBody)只认 store.nearBottom 缓存,不再每个
       * token delta 读一次 scrollHeight —— 文档刚被改脏时那次读是整篇强制重排(实测
       * 7800 节点 23~29ms,干净时 0.95ms)。缓存的唯一写点就是 updateJumpLatest()。 */
      updateJumpLatest(false);
      T('updateJumpLatest(false) → 缓存记「不在底部」,按钮露出来',
        store.nearBottom === false && btn.hidden === false);
      updateJumpLatest(true);
      T('updateJumpLatest(true) → 缓存记「在底部」,按钮收起来',
        store.nearBottom === true && btn.hidden === true);
      box.scrollTop = 0;
      updateJumpLatest(new Event('scroll'));
      T('滚动监听把 Event 塞进来不会被当成「在底部」(只认 boolean,其余自己量)',
        store.nearBottom === false && btn.hidden === false, store.nearBottom + '/' + btn.hidden);

      /* ============ 5. 点它 / End 键 ============ */
      box.scrollTop = Math.round(maxTop() / 2);
      await tick();
      var selBefore = store.selected;
      var callsBefore = window.calls.length;
      btn.click();
      T('点按钮 → 回到底部', maxTop() - box.scrollTop < 2, box.scrollTop + '/' + maxTop());
      T('点完之后按钮自己收起来', btn.hidden === true);
      T('点按钮不会换会话、也不发请求', store.selected === selBefore && window.calls.length === callsBefore,
        store.selected + '/' + window.calls.length);

      setupTuiKeys();
      box.scrollTop = Math.round(maxTop() / 2);
      await waitUntil(function () { return btn.hidden === false; });
      T('(前置)此刻按钮露着,准备按 End', btn.hidden === false);
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'End', bubbles: true }));
      T('End(焦点不在输入框)= 跳回最新(TUI 的 session.last)', maxTop() - box.scrollTop < 2,
        box.scrollTop + '/' + maxTop());

      box.scrollTop = Math.round(maxTop() / 2);
      await tick();
      before = box.scrollTop;
      q('#input').focus();
      var inFieldEv = new KeyboardEvent('keydown', { key: 'End', bubbles: true, cancelable: true });
      q('#input').dispatchEvent(inFieldEv);
      T('End 在输入框里不抢(那儿是「光标到行尾」)', box.scrollTop === before, box.scrollTop + ' vs ' + before);
      T('End 在输入框里也不拦默认行为', inFieldEv.defaultPrevented === false);
      q('#input').blur();

      var dlg = document.createElement('dialog');
      dlg.setAttribute('open', '');
      document.body.appendChild(dlg);
      T('(前置)有对话框开着', anyDialogOpen() === true);
      box.scrollTop = Math.round(maxTop() / 2);
      await tick();
      before = box.scrollTop;
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'End', bubbles: true }));
      T('对话框开着时 End 不抢', box.scrollTop === before, box.scrollTop + ' vs ' + before);
      dlg.remove();

      /* ============ 6. 老页面没有这个按钮 ============ */
      btn.remove();
      var threw = null;
      try { setupJumpLatest(); updateJumpLatest(); jumpToLatest(); } catch (e) { threw = e && e.message; }
      T('按钮不在 DOM 里时什么都不做、不报错(老测试页就是这种)', threw === null, threw);
      box.appendChild(btn);
      setupJumpLatest();
      box.scrollTop = 0;
      await tick();
      T('补回按钮后照常工作', btn.hidden === false);

      /* ============ 7. 分页请求的 query:带游标时不能再带 order(服务端会 400) ============ */
      store.selected = 'ses_a';
      store.msgOlderCursor = null;
      await loadMessages({ older: false });
      var firstUrl = window.calls[window.calls.length - 1].url;
      T('首屏带 order=desc', firstUrl.indexOf('order=desc') >= 0, firstUrl);
      T('首屏不带 cursor', firstUrl.indexOf('cursor=') < 0, firstUrl);
      store.msgOlderCursor = 'cur-old';
      await loadMessages({ older: true });
      var olderUrl = window.calls[window.calls.length - 1].url;
      T('「加载更旧消息」带上游标', olderUrl.indexOf('cursor=cur-old') >= 0, olderUrl);
      T('「加载更旧消息」不再带 order(带了两样服务端就 400:InvalidCursorError)',
        olderUrl.indexOf('order=') < 0, olderUrl);
      store.msgOlderCursor = null;
      var callsBefore = window.calls.length;
      await loadMessages({ older: true });
      T('没有游标时不发请求', window.calls.length === callsBefore);

      /* ============ 7b. 窄屏滚到顶自动拉更旧(§8.41) ============
       * 手机上「导出 / 在TUI打开 / 归档 / 加载更旧消息」那一整行收掉了(styles.css 的
       * html.narrow 那两条),翻旧消息全靠这里:滚到顶替用户点一次那个按钮 —— 走的是
       * 同一段 loadMessages({older:true})(同一个游标、同一套重试与失败话)。
       * 节流四条:窄屏以外不接管、一次进顶只拉一页、上一页在路上不重入、失败过不自动重来。 */
      var html = document.documentElement;
      var hadNarrow7b = html.classList.contains('narrow');
      var calls7b = function () { return window.calls.length; };
      var lastUrl = function () { return (window.calls[window.calls.length - 1] || {}).url || ''; };
      store.selected = 'ses_a';
      store.msgError = '';
      store.msgOlderCursor = 'cur-old';
      html.classList.add('narrow');
      box.scrollTop = 0;
      autoOlderArmed = true;
      var c1 = calls7b();
      await autoLoadOlder(box);
      T('7b1 窄屏到顶 → 自己拉一页(带着游标)',
        calls7b() === c1 + 1 && lastUrl().indexOf('cursor=cur-old') >= 0, calls7b() - c1 + ' ' + lastUrl());
      store.msgOlderCursor = 'cur-old-2';
      var c2 = calls7b();
      box.scrollTop = 0; // 拉完那一下可能把滚动位置挪过(锚点那套),这里明确回到顶区再断
      await autoLoadOlder(box);
      T('7b2 还停在顶区:不再连着拉第二页(一次进顶只拉一页)', calls7b() === c2, calls7b() - c2);
      box.scrollTop = 400;
      await autoLoadOlder(box);
      T('7b3 滚下去(离开顶区)时什么都不发', calls7b() === c2, calls7b() - c2);
      box.scrollTop = 0;
      autoOlderArmed = true; // 逻辑直调这一路要自己上膛;监听那条路下面单独验
      await autoLoadOlder(box);
      T('7b4 重新上膛 → 又拉一页', calls7b() === c2 + 1, calls7b() - c2);
      html.classList.remove('narrow');
      autoOlderArmed = true;
      store.msgOlderCursor = 'cur-old-3';
      var c3 = calls7b();
      await autoLoadOlder(box);
      T('7b5 桌面(不带 narrow)不接管:翻旧仍是点那个按钮', calls7b() === c3, calls7b() - c3);
      html.classList.add('narrow');
      autoOlderArmed = true;
      store.msgOlderCursor = null;
      var c4 = calls7b();
      await autoLoadOlder(box);
      T('7b6 没有更旧的了 → 不发', calls7b() === c4, calls7b() - c4);
      store.msgOlderCursor = 'cur-old-4';
      store.msgError = '上一页挂了';
      autoOlderArmed = true;
      var c5 = calls7b();
      await autoLoadOlder(box);
      T('7b7 上一页失败过 → 不自己重撞(那句「加载失败 + 重试」还在等用户)',
        calls7b() === c5 && store.msgError === '上一页挂了', calls7b() - c5);
      store.msgError = '';
      /* 真正那条路:监听挂一次,顶区里来一发 scroll 就够(合成事件就够确定,不等浏览器那一发) */
      setupAutoOlder();
      store.msgOlderCursor = 'cur-old-5';
      box.scrollTop = 0;
      autoOlderArmed = true;
      var c6 = calls7b();
      box.dispatchEvent(new Event('scroll'));
      for (var w1 = 0; w1 < 25 && calls7b() === c6; w1++) await tick();
      T('7b8 监听那条路:顶区里一发 scroll 就带上一页', calls7b() === c6 + 1, calls7b() - c6);
      /* 等这一页走完:它收尾时会把游标换成服务端给的那个(夹具给的是 null) —— 不等就动手,
         后面那两发 scroll 撞的是「上一页还在路上」,断的就不是上膛了。 */
      for (var w1b = 0; w1b < 25 && autoOlderBusy; w1b++) await tick();
      box.scrollTop = 600;
      box.dispatchEvent(new Event('scroll')); // 离开顶区 → 重新上膛
      store.msgOlderCursor = 'cur-old-6';
      var c7 = calls7b();
      box.scrollTop = 0;
      box.dispatchEvent(new Event('scroll'));
      for (var w2 = 0; w2 < 25 && calls7b() === c7; w2++) await tick();
      T('7b9 再回顶:又带一页(上膛是真的回了)', calls7b() === c7 + 1, calls7b() - c7);
      /* 7c:拉完不许把人顶走 —— 新拉的都在眼前这条【上面】,眼前这一屏必须还在原地。
         夹具里给 ses_a 补一条【更旧的】长消息:这一页拉回来时它会被插到最上面(总高真的长),
         于是这条断言不是空转。 */
      window.SERVER['ses_a'] = [{ id: 'msg_older_big', type: 'user', time: { created: 50 },
        text: '更旧的一条。'.repeat(40) }].concat(window.SERVER['ses_a']);
      for (var w3 = 0; w3 < 25 && autoOlderBusy; w3++) await tick();
      box.scrollTop = 0;
      store.msgError = '';
      store.msgOlderCursor = 'cur-old-7';
      autoOlderArmed = true;
      var at0 = scrollAnchor();
      var top0 = box.scrollTop;
      var h0 = box.scrollHeight;
      await autoLoadOlder(box);
      var at1 = scrollAnchor();
      T('7c1 拉完把人放回原地:眼前那条还是那条、还在屏上同一个位置',
        !!at0 && !!at1 && at0.id === at1.id && Math.abs(at0.off - at1.off) <= 2,
        (at0 && at0.id) + '@' + (at0 && at0.off) + ' → ' + (at1 && at1.id) + '@' + (at1 && at1.off));
      T('7c2 代价就是 scrollTop 跟着长出来的那一截往下走(新内容在上面,不是换成新那一页)',
        box.scrollHeight > h0 && box.scrollTop > top0,
        top0 + ' → ' + box.scrollTop + '(总高 ' + h0 + ' → ' + box.scrollHeight + ')');
      /* 还给后面的组一个干净状态 */
      if (!hadNarrow7b) html.classList.remove('narrow');
      store.msgError = '';
      store.msgOlderCursor = null;
      store.selected = 'ses_a';

      /* ============ 8. 拉消息失败不许一声不响(§8.34) ============
       * 手机上一个 12MB 的会话首页(工具 part 里塞了整份文件/截图)可能下几十秒,也可能
       * 下到一半被掐断。老写法:api() 抛出 → loadMessages 的 catch 一吞 → 消息区永远空着,
       * 用户看到的就是「打开这个会话一片空白」,而标题/状态/操作行全都好好的。
       * 这一段要控住定时器(重试退避 + 「慢到 250ms 才露」都走 setTimeout;
       * 本页的 setTimeout 是被钉住不触发的),这里换成「排队等我手动放」的假定时器。 */
      var savedTO = window.setTimeout, savedCTO = window.clearTimeout;
      var q8 = [];
      window.setTimeout = function (fn) { q8.push(fn); return q8.length; };
      window.clearTimeout = function (id) { if (id) q8[id - 1] = null; };
      /* 放一轮定时器 + 把微任务抽干(重试是个 await 链,得让它跑起来) */
      var pump = async function (rounds) {
        for (var i = 0; i < (rounds || 8); i++) {
          var t = q8; q8 = [];
          t.forEach(function (fn) { if (fn) fn(); });
          await Promise.resolve(); await Promise.resolve();
        }
      };
      var stateEl = q('#msgState');
      var stateText = q('#msgStateText');
      var retryBtn = q('#msRetry');
      var msgCalls = function () {
        return window.calls.filter(function (c) { return /\/message/.test(c.url); }).length;
      };

      /* 8a. 形状 + 接线 */
      setupMsgState();
      T('#msgState 在页面里、是 #messages 的子元素(切会话清空时引用留在外面)',
        !!stateEl && stateEl.parentElement === box);
      T('默认就是收起来的(平时一个像素都不占)', stateEl.hidden === true);
      T('带 .msgstate(自带 [hidden] 的 display:none —— 它是 flex,光靠 hidden 压不住)',
        stateEl.classList.contains('msgstate'));
      T('重试是个 .chip(窄屏自动拿到 44px 命中区)',
        retryBtn.tagName === 'BUTTON' && retryBtn.classList.contains('chip'));
      var add8 = 0;
      var orig8 = retryBtn.addEventListener.bind(retryBtn);
      retryBtn.addEventListener = function () { add8++; return orig8.apply(null, arguments); };
      setupMsgState();
      retryBtn.addEventListener = orig8;
      T('重复接线不再挂监听(init 会被反复调)', add8 === 0, add8);

      /* 8b. 慢的时候露一句「正在加载消息…」,快的时候不闪 */
      var gate = {};
      gate.promise = new Promise(function (r) { gate.release = r; });
      window.GATE = gate.promise;
      var p8 = selectSession('ses_a');
      await Promise.resolve();
      T('才出门这一下(没到 250ms)→ 不闪「正在加载」(本机会话 30ms 就回来了)',
        stateEl.hidden === true, 'hidden=' + stateEl.hidden);
      await pump(1); // 放掉那个 250ms 的定时器
      T('慢过 250ms 还没回来 → 露「正在加载消息…」',
        stateEl.hidden === false && stateText.textContent === '正在加载消息…', stateText.textContent);
      T('这时候不该有「重试」(还没失败)', retryBtn.hidden === true);
      gate.release();
      window.GATE = null;
      await pump(6); await p8;
      T('回来了 → 那句话自己收起来', stateEl.hidden === true);
      T('内容也正常渲染', box.textContent.indexOf('会话 A 的第一问') >= 0);

      /* 8c. 连打回三次(首发 + 两次重试都失败)→ 亮原因 + 重试 */
      window.FAIL = { ses_a: 3 };
      var n0 = msgCalls();
      var p9 = selectSession('ses_a');
      await pump(20); await p9;
      T('自动重试两轮:一共发了 3 次(1 首发 + 2 重试)', msgCalls() - n0 === 3, msgCalls() - n0);
      T('失败留下证据:原因写在消息区末尾(不再是一片空白)', store.msgError === '模拟打回', store.msgError);
      T('状态行露出来、文案是「加载失败:<原因>」',
        stateEl.hidden === false && stateText.textContent === '加载失败:模拟打回', stateText.textContent);
      T('并且给了一个「重试」', retryBtn.hidden === false);
      T('状态行贴在消息流末尾', box.lastElementChild === stateEl || box.children[box.children.length - 2] === stateEl,
        box.lastElementChild && box.lastElementChild.id);
      T('没消息就是没消息,不许画成「这个会话没有内容」', box.querySelectorAll('.msg').length === 0);

      /* 8d. 点「重试」:真的再拉一次,成功就把状态行收掉 */
      window.FAIL = { ses_a: 0 };
      n0 = msgCalls();
      retryBtn.click();
      await pump(6);
      T('点重试 → 重新发一次请求', msgCalls() - n0 === 1, msgCalls() - n0);
      T('成功了 → 内容出来', box.textContent.indexOf('会话 A 的第一问') >= 0);
      T('成功了 → 状态行收起、错误清掉', stateEl.hidden === true && !store.msgError);

      /* 8e. 半截正文(200 + 非法 JSON)与「没有 data 数组」都算失败,不许静默成空 */
      window.BROKEN = { ses_a: 3 };
      var pa = selectSession('ses_a');
      await pump(20); await pa;
      T('下到一半的正文(JSON.parse 失败)→ 当成失败,不静默成「没有消息」',
        store.msgError.indexOf('JSON') >= 0, store.msgError);
      window.BROKEN = null;
      window.SHAPE = { ses_a: 3 };
      var pb = selectSession('ses_a');
      await pump(20); await pb;
      T('响应里没有 data 数组 → 也算失败(空数组和「没拿到」必须分得开)',
        store.msgError === '响应里没有消息数组', store.msgError);
      window.SHAPE = null;

      /* 8f. 切走之后:旧会话的失败与重试都不许跟过来 */
      window.FAIL = { ses_a: 3 };
      var pc = selectSession('ses_a');
      await pump(1);
      await selectSession('ses_long');
      window.FAIL = null;
      await pump(10); await pc;
      T('切走时把上一代的失败重试作废(不会回来覆盖新会话)', !store.msgError, store.msgError);
      T('新会话照常渲染', box.textContent.indexOf('第 59 条消息') >= 0);
      T('状态行收起来', stateEl.hidden === true);

      /* 8g. 取消选中:消息区被清空,那句话也得跟着走(不然会粘到下一个会话) */
      store.msgError = '上一回的残留';
      paintMsgState();
      T('(前置)残留的失败话露着', stateEl.hidden === false);
      clearSelection();
      T('取消选中 → 失败话撤掉、状态行收起', stateEl.hidden === true && !store.msgError);
      T('而且 #msgState 还在 DOM 里(没被 innerHTML 一起抹掉)',
        stateEl.isConnected && stateEl.parentElement === box);

      window.setTimeout = savedTO;
      window.clearTimeout = savedCTO;

      /* ============ 9. 一页拉多少条:手机 30、桌面 100(§8.35) ============
       * 首页体量差得很远(实测某个会话 100 条 12.9MB、最新 30 条 2.1MB,大头是工具 part
       * 里带回的整份文件与截图)。手机的用法是「看一眼」,所以窄屏按 30 条一页;
       * 翻旧也跟着这套走 —— 不然翻一页又拉回十几 MB。 */
      var doc = document.documentElement;
      var lastUrl = function () { return window.calls[window.calls.length - 1].url; };
      doc.classList.remove('narrow');
      store.selected = 'ses_a';
      await loadMessages({ older: false });
      T('桌面(不窄)一页 100 条', lastUrl().indexOf('limit=100') >= 0, lastUrl());
      doc.classList.add('narrow');
      await loadMessages({ older: false });
      T('手机(html.narrow)一页 30 条', lastUrl().indexOf('limit=30') >= 0, lastUrl());
      store.msgOlderCursor = 'cur-old';
      await loadMessages({ older: true });
      T('窄屏翻旧也是 30 条一页(不然翻一页又拉回十几 MB)',
        lastUrl().indexOf('limit=30') >= 0 && lastUrl().indexOf('cursor=cur-old') >= 0, lastUrl());
      store.msgOlderCursor = null;
      doc.classList.remove('narrow');
      await loadMessages({ older: false });
      T('转回宽屏又按 100(口径跟着 html.narrow 走,转屏即时生效)',
        lastUrl().indexOf('limit=100') >= 0, lastUrl());
      T('两个数各只有一处(MSG_PAGE_WIDE / MSG_PAGE_NARROW)',
        MSG_PAGE_WIDE === 100 && MSG_PAGE_NARROW === 30 && msgPageSize() === 100,
        MSG_PAGE_WIDE + '/' + MSG_PAGE_NARROW);

      /* ============ 10. 贴完底再跟几帧:估值落定不许把底顶歪(§8.36) ============
       * cvmany 下 scrollHeight 是估值,浏览器是【贴完之后】才把它落定的 —— 一落定
       * scrollTop 就被夹回去,而这时往往已经没有下一次渲染来纠正(事件不来就永远停着)。
       * 这一段用「内容突然变高」模拟那次落定:老写法里没人管,于是停在最新消息上面一截。 */
      T('有 repinUntilStable,收手条件是「高度稳定」+ 一道自保上限(§8.46:不再盯时间)',
        typeof repinUntilStable === 'function' && REPIN_STABLE_FRAMES >= 2 && REPIN_MAX_MS >= 1000,
        typeof repinUntilStable + '/' + REPIN_STABLE_FRAMES + '/' + REPIN_MAX_MS);
      await selectSession('ses_long'); // 60 条 → cvmany 挂着
      await waitUntil(function () { return maxTop() - box.scrollTop < 2; });
      T('(前置)长会话挂着 cvmany', box.classList.contains('cvmany'));
      T('(前置)此刻在底部', maxTop() - box.scrollTop < 2, box.scrollTop + '/' + maxTop());
      /* 「盯内容高度」那只眼:每次渲染收尾都把 #messages 的子元素交给 ResizeObserver */
      T('renderMessages 收尾时把内容元素全交给 ResizeObserver(不是常驻 rAF)',
        typeof syncRepinWatch === 'function' && typeof setupRepinWatch === 'function' &&
        repinSeen.size === box.children.length,
        repinSeen.size + '/' + box.children.length);
      /* 高度稳的时候两帧就收手,不再一路跟满 REPIN_MAX_MS。
       * 先等高度真的稳住:刚切进这条 60 条的会话时,估值还在落定。 */
      var hPrev = -1;
      var hSame = 0;
      for (var gi9 = 0; gi9 < 30 && hSame < 3; gi9++) {
        await tick();
        if (box.scrollHeight === hPrev) hSame++;
        else { hSame = 0; hPrev = box.scrollHeight; }
      }
      T('(前置)高度已经稳住(估值落定完了)', hSame >= 3, hSame);
      var pins = 0;
      var realPin = pinBottom;
      pinBottom = function (b) { pins++; return realPin(b); };
      repinUntilStable(box);
      await tick(); await tick(); await tick(); await tick(); await tick();
      pinBottom = realPin;
      T('高度连续两帧没变就收手(以前是白等满 800ms)', pins === 1, pins);
      var grow = document.createElement('div');
      grow.style.height = '600px';
      box.appendChild(grow);
      syncRepinWatch(); // 真页面里这步是 renderMessages 收尾做的
      store.gestureAt = 0; // 前面那些组点过按钮,别让「刚点过就不抢」这条挡住
      await waitUntil(function () { return maxTop() - box.scrollTop < 2; });
      T('贴完底之后内容又变高(≈估值落定)→ 自动贴回底部', maxTop() - box.scrollTop < 2,
        box.scrollTop + '/' + maxTop());
      T('而且按钮没冒出来(面板仍认为在底部)', btn.hidden === true);

      /* 用户往上滚之后必须停手 —— 跟帧不许把人拽回来 */
      box.scrollTop = Math.max(0, maxTop() - 500);
      await waitUntil(function () { return store.nearBottom === false; });
      T('(前置)往上滚了 → 已让路', store.nearBottom === false);
      var held = box.scrollTop;
      grow.style.height = '1200px';
      await tick(); await tick(); await tick();
      T('让路之后再变高 → 一动不动(没把人拽回底部)', box.scrollTop === held, box.scrollTop + ' vs ' + held);
      T('按钮这时该露着', btn.hidden === false);
      grow.remove();
      box.scrollTop = box.scrollHeight;
      await tick();
      T('(复位)清掉那块高的、回到底部', maxTop() - box.scrollTop < 2, box.scrollTop + '/' + maxTop());

      /* 「图迟一步撑开」:采样早收手了(不在任何时间窗口里),靠 ResizeObserver 接住 */
      var late = document.createElement('div');
      late.style.height = '0px';
      box.appendChild(late);
      syncRepinWatch();
      await tick();
      T('(前置)迟到的那个元素已经在观察名单里', repinSeen.has(late) === true);
      late.style.height = '700px';
      await tick(); await tick(); await tick();
      T('图迟到撑开(采样早收手了)→ 照样贴回底部', maxTop() - box.scrollTop < 2,
        box.scrollTop + '/' + maxTop());
      /* 用户刚点过(多半是点开 <details>):内容长高是他自己要的,不抢着贴 */
      store.gestureAt = Date.now();
      var before9 = box.scrollTop;
      late.style.height = '1000px';
      await tick(); await tick(); await tick();
      T('刚点过就不抢(点开 <details> 撑高不该把人拽到底)',
        box.scrollTop === before9 && maxTop() - box.scrollTop > 100, box.scrollTop + '/' + maxTop());
      store.gestureAt = 0;
      late.style.height = '1100px';
      await tick(); await tick(); await tick();
      T('(复原)过了那 400ms 的话它照旧贴(免得那条挡住正常补贴)', maxTop() - box.scrollTop < 2,
        box.scrollTop + '/' + maxTop());
      late.remove();
      box.scrollTop = box.scrollHeight;
      await tick();

      /* 新一轮渲染要把上一轮采样作废 —— 否则它会在新内容上乱贴位置 */
      var seq0 = repinSeq;
      await loadMessages();
      T('每一次渲染都把上一轮采样作废(repinSeq 涨了)', repinSeq > seq0, seq0 + '→' + repinSeq);

      document.getElementById('results').textContent = out.join('\n');
      document.title = 'FAIL=' + out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' TOTAL=' + out.length;
      post(out.join('\n'));
    } catch (e) {
      document.getElementById('results').textContent = out.join('\n');
      post(out.join('\n') + '\nPAGE-ERROR name=' + (e && e.name) + ' message=' + (e && e.message) +
           ' stack=' + (e && e.stack));
    }
  })();
  </script>
</body>
</html>
