<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>layout unit</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header id="topbar"><div class="brand">t</div>
    <label class="f"><span>搜索</span><input id="search"></label>
    <label class="f"><span>工程目录</span><select id="dirFilter"></select></label>
    <label class="f"><span>排序</span><select id="order"><option value="desc">最近更新</option><option value="asc">最早更新</option></select></label>
    <div class="lbtools"><button id="btnNew">+ 新建</button><button id="btnImport">导入</button><button id="refresh">刷新</button></div>
    <label class="chk"><input type="checkbox" id="showArchived"></label>
    <span id="count"></span><span id="archivedCount"></span>
    <div id="status" class="status"></div>
  </header>
  <main>
    <section id="listpane"><table id="list"><tbody></tbody></table><button id="loadMore" hidden></button></section>
    <div class="resizer" id="resizer-mid">
      <button id="btnList" class="handle" type="button" aria-expanded="true" aria-label="收起会话列表">
        <span class="ao" aria-hidden="true">‹</span><span class="ac" aria-hidden="true">›</span>
      </button>
    </div>
    <section id="chatpane">
      <div id="chatHeader">
        <div class="chline"><span id="chatTitle"></span><span id="chatState"></span></div>
        <div id="chatMeta"></div>
        <div id="chatOps" hidden>
          <button type="button" id="opExport"></button><button type="button" id="opTui"></button><button type="button" id="opArchive"></button>
        </div>
        <button id="older" hidden></button>
      </div>
      <div id="messages"></div><div id="asks" hidden></div><div id="inbox" hidden></div>
      <div id="composer">
        <div id="ctoolbar" hidden>
          <label class="ctl"><span>智能体</span><select id="agentSel"><option value=""></option></select></label>
          <label class="ctl"><span>模型</span><select id="modelSel"><option value=""></option></select></label>
          <label class="ctl" id="variantWrap" hidden><span>变体</span><select id="variantSel"></select></label>
          <span class="ctl-spacer"></span>
          <div id="delivery" class="seg" hidden><button type="button" data-delivery="queue">排队</button><button type="button" data-delivery="steer">插话</button></div>
          <button type="button" id="interrupt" hidden>■ 中断</button>
        </div>
        <div class="cinput"><textarea id="input"></textarea><button id="send"></button></div>
      </div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <pre id="results"></pre>

  <script>
    /* 屏蔽 app.js 的自动 init(本页自己控制接线时机) */
    var __add = document.addEventListener.bind(document);
    document.addEventListener = function (t, fn, o) {
      if (t === 'DOMContentLoaded') return;
      return __add(t, fn, o);
    };

    var SESSIONS = [
      { id: 'ses_a', title: '会话 A', projectID: 'pj1', time: { created: 1, updated: 5 },
        tokens: { input: 10, output: 5 }, cost: 0, location: { directory: '/proj/a' } },
      { id: 'ses_b', title: '会话 B', projectID: 'pj1', time: { created: 1, updated: 4 },
        tokens: { input: 1, output: 1 }, cost: 0, location: { directory: '/proj/b' } },
    ];
    var AGENTS = [{ id: 'build', name: 'Build', mode: 'primary', hidden: false }];
    var MODELS = [{ providerID: 'company', modelID: 'deepseek-v4-flash', name: 'Flash', enabled: true, variants: [] }];

    window.SERVER = {
      'ses_a': [
        { id: 'msg_a1', type: 'user', time: { created: 100 }, text: '会话 A 的第一问' },
        { id: 'msg_a2', type: 'assistant', time: { created: 200, completed: 300 },
          model: { id: 'deepseek-v4-flash', providerID: 'company' },
          content: [{ type: 'text', text: '会话 A 的回答' }] },
      ],
      'ses_b': [
        { id: 'msg_b1', type: 'user', time: { created: 100 }, text: '会话 B 的第一问' },
      ],
    };

    /* 会话内滚动位置要一个够长的会话(短消息撑不出滚动条) */
    window.SERVER['ses_long'] = (function () {
      var arr = [];
      for (var i = 0; i < 60; i++) {
        arr.push({ id: 'msg_l' + i, type: 'user', time: { created: 1000 + i },
          text: '第 ' + i + ' 条消息:用来把对话区撑到能滚动。' });
      }
      return arr;
    })();

    window.__realFetch = window.fetch.bind(window);
    window.calls = [];
    var json = function (obj) { return { ok: true, status: 200, text: async function () { return JSON.stringify(obj); } }; };

    window.confirm = function () { return true; }; // 「删除会话」的重确认

    window.fetch = async function (url, opts) {
      var u = String(url);
      var method = (opts && opts.method) || 'GET';
      window.calls.push({ url: u, method: method, body: (opts && opts.body) || null });
      var m = u.match(/^\/api\/session\/([^/?]+)\/message/);
      if (m) return json({ data: window.SERVER[decodeURIComponent(m[1])] || [], cursor: {} });
      if (u.indexOf('/api/session/active') === 0) return json({ data: {} });
      if (u.indexOf('/api/agent') === 0) return json({ data: AGENTS });
      if (u.indexOf('/api/model') === 0) return json({ data: MODELS });
      if (/^\/api\/session\/[^/?]+\/(inbox|form|permission)/.test(u)) return json({ data: [] });
      if (u.indexOf('/api/session?') === 0) return json({ data: SESSIONS, cursor: {} });
      return json({ data: [] });
    };
    window.EventSource = class { constructor() {} close() {} };
    window.setInterval = function () { return 0; };
    window.setTimeout = function () { return 0; };
    window.clearTimeout = function () {};
  </script>
  <script src="/app.js"></script>
  <script>
  (async function () {
    var post = function (b) { try { window.__realFetch('/result', { method: 'POST', body: b }); } catch (_) {} };
    var out = [];
    var T = function (name, cond, extra) {
      out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : ' | got=' + JSON.stringify(extra)));
    };
    var q = function (s) { return document.querySelector(s); };
    var main = q('main');
    var btn = q('#btnList');
    var listPane = q('#listpane');
    var resizer = q('#resizer-mid');
    var chatPane = q('#chatpane');
    var hiddenOf = function (el) { return getComputedStyle(el).display === 'none'; };
    var ao = q('#btnList .ao'), ac = q('#btnList .ac');
    // 手柄上的两个箭头都在 DOM 里,由 CSS 决定露哪一个;用计算样式判断,不看文案
    var arrow = function () {
      if (hiddenOf(ac)) return 'ao';
      if (hiddenOf(ao)) return 'ac';
      return 'both';
    };
    /* 等异步链路跑完:纯微任务轮转,不用定时器(本页把 setTimeout 打桩了) */
    var settle = async function (pred, tries) {
      for (var i = 0; i < (tries || 300); i++) {
        if (pred()) return true;
        await Promise.resolve();
      }
      return pred();
    };

    try {
      /* ============ 1. 列表折叠:默认展开 ============ */
      localStorage.clear();
      setupListToggle();
      T('初始是展开的', !main.classList.contains('list-hidden'));
      T('初始箭头是「‹」(露出 .ao)', arrow() === 'ao', arrow());
      T('初始 aria-expanded=true', btn.getAttribute('aria-expanded') === 'true');
      T('初始 aria-label 是「收起会话列表」', btn.getAttribute('aria-label') === '收起会话列表', btn.getAttribute('aria-label'));
      T('初始列表可见', !hiddenOf(listPane) && !hiddenOf(resizer));
      T('初始对话区可见', !hiddenOf(chatPane));
      T('手柄就长在分栏条里(收起后不会跟着消失)', btn.parentElement === resizer);

      /* 先拖出一个自定义列宽,用来验证「收起再展开」不会把它吃掉 */
      main.style.setProperty('--list-w', '420px');
      T('列宽已设为 420px', getComputedStyle(main).gridTemplateColumns.indexOf('420px') === 0,
        getComputedStyle(main).gridTemplateColumns);

      /* ============ 2. 点一下收起 ============ */
      btn.click();
      T('点击后 main 带 list-hidden', main.classList.contains('list-hidden'));
      T('点击后箭头翻成「›」(露出 .ac)', arrow() === 'ac', arrow());
      T('点击后 aria-expanded=false', btn.getAttribute('aria-expanded') === 'false');
      T('点击后 aria-label 改成「展开会话列表」', btn.getAttribute('aria-label') === '展开会话列表', btn.getAttribute('aria-label'));
      T('点击后本地存储记为收起', localStorage.getItem('ocs.listHidden') === '1');
      T('收起时列表被 display:none', hiddenOf(listPane));
      /* 回归锁:分栏条是唯一的展开入口,收起后它【必须】还在 ——
         一旦跟着 display:none,列表就再也拉不回来了 */
      T('收起时分栏条仍然可见', !hiddenOf(resizer));
      T('收起后手柄仍有实际大小(点得到)', btn.getBoundingClientRect().width > 0 && btn.getBoundingClientRect().height > 0,
        [btn.getBoundingClientRect().width, btn.getBoundingClientRect().height]);
      T('收起后手柄没被挤出视口', btn.getBoundingClientRect().left >= 0 && btn.getBoundingClientRect().top >= 0,
        [btn.getBoundingClientRect().left, btn.getBoundingClientRect().top]);
      T('收起后分栏条仍是 16px 窄槽', Math.abs(resizer.getBoundingClientRect().width - 16) < 0.5,
        resizer.getBoundingClientRect().width);
      T('收起后对话区仍有宽度(不会整片变白)', chatPane.getBoundingClientRect().width > 100,
        chatPane.getBoundingClientRect().width);
      T('收起后让出的正好是列表那一列(只少了 16px 窄槽)',
        Math.abs((main.getBoundingClientRect().width - chatPane.getBoundingClientRect().width) - 16) < 1,
        [main.getBoundingClientRect().width, chatPane.getBoundingClientRect().width]);
      T('收起后第一列宽度为 0', getComputedStyle(main).gridTemplateColumns.indexOf('0px') === 0,
        getComputedStyle(main).gridTemplateColumns);
      T('收起后仍是三列(第一列为 0)', getComputedStyle(main).gridTemplateColumns.split(' ').length === 3,
        getComputedStyle(main).gridTemplateColumns);

      /* ============ 3. 收起态点手柄能重新展开(入口没丢) ============ */
      btn.click();
      T('收起态点手柄能重新展开', !main.classList.contains('list-hidden'));
      T('箭头回到「‹」', arrow() === 'ao', arrow());
      T('aria-expanded 回到 true', btn.getAttribute('aria-expanded') === 'true');
      T('展开后本地存储清空', localStorage.getItem('ocs.listHidden') === null);
      T('展开后列表回来了', !hiddenOf(listPane) && !hiddenOf(resizer));
      T('展开后自定义列宽没被吃掉', main.style.getPropertyValue('--list-w') === '420px',
        main.style.getPropertyValue('--list-w'));
      T('展开后网格回到三列(420px + 16px + 1fr)',
        getComputedStyle(main).gridTemplateColumns.indexOf('420px') === 0 &&
          getComputedStyle(main).gridTemplateColumns.split(' ').length === 3,
        getComputedStyle(main).gridTemplateColumns);
      T('展开后对话区宽度小于 main(让出了列表)', chatPane.getBoundingClientRect().width < main.getBoundingClientRect().width);

      /* ============ 3b. 手柄不吃拖拽:点手柄≠拖宽度,点条上空白才是拖宽度 ============ */
      resizer.setPointerCapture = function () {};
      resizer.releasePointerCapture = function () {};
      setupResizers();
      var wOpen = main.style.getPropertyValue('--list-w');
      var pd = function (target) {
        try { target.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: 500, pointerId: 7 })); } catch (e) {}
      };
      pd(btn);
      T('点手柄不会进入拖拽态', !document.body.classList.contains('resizing'));
      T('点手柄不会改动列宽', main.style.getPropertyValue('--list-w') === wOpen,
        [wOpen, main.style.getPropertyValue('--list-w')]);
      pd(resizer);
      T('点分栏条空白处仍能进入拖拽态', document.body.classList.contains('resizing'));
      try { resizer.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 7 })); } catch (e) {}
      T('拖拽结束后退出拖拽态', !document.body.classList.contains('resizing'));

      /* ============ 3c. 鼠标靠左边缘 → 列表临时拉出来 ============ */
      setupListPeek();
      T('接线后不留临时态', !main.classList.contains('list-peek'));
      var addCallsPeek = 0;
      var origAddPeek = main.addEventListener.bind(main);
      main.addEventListener = function () { addCallsPeek++; return origAddPeek.apply(null, arguments); };
      setupListPeek();
      main.addEventListener = origAddPeek;
      T('重复接线不再挂监听', addCallsPeek === 0, addCallsPeek);

      localStorage.setItem('ocs.listHidden', '1');
      setupListToggle();
      T('(前置)列表已收起', main.classList.contains('list-hidden') && hiddenOf(listPane));
      var rzEdge = resizer.getBoundingClientRect().right;
      T('(前置)收起时分栏槽就贴在左边缘', rzEdge < 20, rzEdge);

      var mv = function (x) {
        main.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: x, clientY: 300 }));
      };
      mv(5);
      T('鼠标贴到左边缘 → 临时拉出来(list-peek)', main.classList.contains('list-peek'));
      T('临时拉出来时列表是看得见的', !hiddenOf(listPane));
      T('临时拉出来时不写记忆:list-hidden 还在', main.classList.contains('list-hidden'));
      T('临时拉出来时不写记忆:localStorage 还是 1', localStorage.getItem('ocs.listHidden') === '1');
      T('临时展开后分栏槽跟着列表挪到右边(不再是最左边那条)', resizer.getBoundingClientRect().right > rzEdge + 100,
        [rzEdge, resizer.getBoundingClientRect().right]);
      T('临时展开后对话区仍有宽度(不会整片变白)', chatPane.getBoundingClientRect().width > 100,
        chatPane.getBoundingClientRect().width);
      T('临时展开用的是用户拖出来的列宽(420px)', getComputedStyle(main).gridTemplateColumns.indexOf('420px') === 0,
        getComputedStyle(main).gridTemplateColumns);
      T('临时展开的列表有一道阴影(看得出是浮层)', getComputedStyle(listPane).boxShadow !== 'none',
        getComputedStyle(listPane).boxShadow);

      mv(200);
      T('在列表里挪动不算离开(还留着)', main.classList.contains('list-peek'));
      var rzEdgePeek = resizer.getBoundingClientRect().right;
      mv(rzEdgePeek + 5);
      T('挪进对话区 → 收回', !main.classList.contains('list-peek'));
      T('收回后列表又藏起来了', hiddenOf(listPane));
      T('收回后分栏槽回到左边缘', resizer.getBoundingClientRect().right < 20,
        resizer.getBoundingClientRect().right);

      mv(5);
      T('再靠回去还能拉出来', main.classList.contains('list-peek'));
      main.dispatchEvent(new MouseEvent('mouseleave'));
      T('鼠标移出主区(含移出窗口)→ 收回', !main.classList.contains('list-peek'));

      /* 临时展开期间点手柄 = 显式展开并保持 */
      mv(5);
      T('(前置)此刻是临时展开', main.classList.contains('list-peek'));
      btn.click();
      T('临时展开期间点手柄 → 变成显式展开', !main.classList.contains('list-hidden'));
      T('显式展开后记忆清空(下次启动还是展开)', localStorage.getItem('ocs.listHidden') === null);
      T('显式展开后临时态也摘掉了', !main.classList.contains('list-peek'));
      mv(400);
      T('显式展开时鼠标乱动也不会冒临时态', !main.classList.contains('list-peek'));
      T('显式展开时列表照旧可见', !hiddenOf(listPane));

      /* 窄屏不玩这一套 */
      document.documentElement.classList.add('narrow');
      localStorage.setItem('ocs.listHidden', '1');
      setupListToggle();
      T('(前置)窄屏下重新收起', main.classList.contains('list-hidden'));
      mv(5);
      T('窄屏不玩这一套(.resizer 本来就是 display:none)', !main.classList.contains('list-peek'));
      document.documentElement.classList.remove('narrow');
      localStorage.removeItem('ocs.listHidden');
      setupListToggle();
      setupListPeek();
      T('(收尾)回到展开态、不留临时态',
        !main.classList.contains('list-hidden') && !main.classList.contains('list-peek'));

      /* ============ 3d. 动手之前先武装宽限期(原生弹窗会抢走指针) ============
       * 用户报的:靠左边缘把列表临时拉出来,删掉一个会话,列表「当场收回」;
       * 收回后分栏槽缩回 x=0..16,指针已经不在槽里,再动一下就被判成「挪进对话区」,
       * 于是再也拉不回来 —— 想接着删下一个都不行。根子是原生 confirm 一弹,
       * 浏览器就把指针当成离开了文档,main 收到 mouseleave 把临时态摘了。
       * 改法:onAction() 动手之前叫一声 listPeekHold(),宽限期里那一次 mouseleave 吞掉。 */
      localStorage.setItem('ocs.listHidden', '1');
      setupListToggle();
      setupListPeek();
      mv(5);
      T('(前置)临时展开着', main.classList.contains('list-peek'));
      store.sessions.set('ses_c', { id: 'ses_c', title: '会话 C', time: { created: 1, updated: 3 } });
      await onAction('del', 'ses_c'); // 真走一遍删除(本页 confirm 被桩成 true)
      T('(前置)会话确实删掉了', !store.sessions.has('ses_c'));
      T('删完之后列表还留着(没被弹窗抢指针那一下收掉)', main.classList.contains('list-peek'));
      main.dispatchEvent(new MouseEvent('mouseleave'));
      T('宽限期里那一次 mouseleave 被吞掉', main.classList.contains('list-peek'));
      main.dispatchEvent(new MouseEvent('mouseleave'));
      T('宽限期只管一次:再离开还是照常收', !main.classList.contains('list-peek'));
      T('收掉之后列表也藏起来了', hiddenOf(listPane));

      mv(5);
      T('(前置)又拉出来了', main.classList.contains('list-peek'));
      store.sessions.set('ses_d', { id: 'ses_d', title: '会话 D', time: { created: 1, updated: 2 } });
      await onAction('del', 'ses_d');
      T('(前置)删完还留着', main.classList.contains('list-peek'));
      mv(resizer.getBoundingClientRect().right + 5);
      T('宽限期不挡真实移动:挪进对话区照样立刻收', !main.classList.contains('list-peek'));

      localStorage.removeItem('ocs.listHidden');
      setupListToggle();
      setupListPeek();
      await onAction('del', 'ses_e'); // 列表好好开着的时候动手
      T('列表本来就开着时不武装(别把正常的 mouseleave 也吞掉)', peekLeaveGuard === 0, peekLeaveGuard);

      /* ============ 4. 折叠状态被记住(模拟刷新后重新接线) ============ */
      localStorage.setItem('ocs.listHidden', '1');
      setupListToggle(); // 重复接线:只按存储重画,不应重复挂监听
      T('重新接线后按存储进入收起态', main.classList.contains('list-hidden'));
      T('重新接线后箭头为「›」', arrow() === 'ac', arrow());
      btn.click();
      T('重复接线后单击只切换一次(不会一次点两下)', !main.classList.contains('list-hidden'));
      T('展开后不残留收起状态', localStorage.getItem('ocs.listHidden') === null);

      /* ============ 5. hash 解析(hashToID) ============ */
      T('hashToID:#ses_a → ses_a', hashToID('#ses_a') === 'ses_a');
      T('hashToID:没有 # 也认', hashToID('ses_a') === 'ses_a');
      T('hashToID:空 hash → null', hashToID('#') === null && hashToID('') === null);
      T('hashToID:null/undefined → null', hashToID(null) === null && hashToID(undefined) === null);
      T('hashToID:不是会话 id 不认', hashToID('#foo') === null && hashToID('#project_1') === null);
      T('hashToID:会做 URL 解码', hashToID('#ses%5Fa') === 'ses_a', hashToID('#ses%5Fa'));
      T('hashToID:非法转义不炸', hashToID('#ses%zz') === 'ses%zz', hashToID('#ses%zz'));

      /* ============ 6. 选中会话写进 hash ============ */
      SESSIONS.forEach(function (s) { store.sessions.set(s.id, s); });
      renderSessions();
      location.hash = '';
      store.selected = null;
      await selectSession('ses_a');
      T('选中后 hash 变为 #ses_a', location.hash === '#ses_a', location.hash);
      T('选中后会话消息已渲染', q('#messages').textContent.indexOf('会话 A 的第一问') >= 0);
      await selectSession('ses_b');
      T('切到另一个会话后 hash 跟着变', location.hash === '#ses_b', location.hash);

      /* ============ 7. 删除当前会话时清掉 hash ============ */
      await onAction('del', 'ses_b');
      T('删除后不再是选中态', store.selected === null, store.selected);
      T('删除后 hash 被清空(否则刷新会去恢复一个已删除的会话)', location.hash === '', location.hash);
      T('删除后不再显示该会话的消息', q('#messages').textContent.indexOf('会话 B 的第一问') < 0);

      /* ============ 8. 刷新后恢复:restoreFromHash ============ */
      location.hash = '#ses_a';
      store.selected = null;
      store.messages.clear();
      q('#messages').innerHTML = '';
      await restoreFromHash();
      T('从 hash 恢复到会话 A', store.selected === 'ses_a', store.selected);
      T('恢复后消息渲染出来', q('#messages').textContent.indexOf('会话 A 的第一问') >= 0);
      T('恢复后标题取到了会话名', q('#chatTitle').textContent === '会话 A', q('#chatTitle').textContent);
      T('恢复后列表里该行被标记选中', !!q('#list tbody tr[data-id="ses_a"].selected'), q('#list tbody').innerHTML.slice(0, 200));

      /* 不抢用户已经做出的选择 */
      await selectSession('ses_b');
      location.hash = '#ses_a';
      await restoreFromHash();
      T('已有选择时 restoreFromHash 不抢', store.selected === 'ses_b', store.selected);

      /* 会话已被删除 / 不存在:不炸、不白屏 */
      location.hash = '#ses_gone';
      store.selected = null;
      await restoreFromHash();
      T('hash 指向不存在的会话时不炸且仍选中该 id', store.selected === 'ses_gone', store.selected);
      T('不存在的会话渲染为空而不是残留上一条',
        q('#messages').textContent.indexOf('会话 B 的第一问') < 0, q('#messages').textContent);

      /* hash 为空 / 非法:什么都不做 */
      location.hash = '';
      store.selected = null;
      await restoreFromHash();
      T('hash 为空时不选任何会话', store.selected === null, store.selected);
      location.hash = '#foo';
      await restoreFromHash();
      T('hash 非法时不选任何会话', store.selected === null, store.selected);

      /* ============ 9. 浏览器前进/后退(H 组 2) ============ */
      window.__pop = 0;
      window.addEventListener('popstate', function () { window.__pop++; });
      setupHistoryNav();

      /* 点会话入历史栈;重复点同一个不再多压一格 */
      history.replaceState(null, '', location.pathname + location.search);
      store.selected = null;
      var LEN = history.length;
      SESSIONS.forEach(function (s) { store.sessions.set(s.id, s); }); // 第 7 节删过 ses_b,这里补回来
      await selectSession('ses_a');
      T('点会话把这一格压进历史栈', history.length === LEN + 1, history.length + ' vs ' + (LEN + 1));
      T('pushState 后 hash 是 #ses_a', location.hash === '#ses_a', location.hash);
      await selectSession('ses_a');
      T('重复点同一个会话不再入栈(否则后退要点好几次才动)', history.length === LEN + 1, history.length);
      await selectSession('ses_b');
      T('切到另一个会话再入一格', history.length === LEN + 2, history.length);

      /* 模拟后退:浏览器会先把 URL 换成上一格,再派发 popstate */
      history.replaceState(null, '', '#ses_a');
      T('只换 URL 还没触发事件时不动会话', store.selected === 'ses_b', store.selected);
      window.dispatchEvent(new PopStateEvent('popstate'));
      T('收到 popstate 后切到 URL 里的会话', store.selected === 'ses_a', store.selected);
      T('跟随后退不会把这一格再压一遍', history.length === LEN + 2, history.length);
      await settle(function () { return q('#messages').textContent.indexOf('会话 A 的第一问') >= 0; });
      T('跟随后退后消息也换成该会话的', q('#messages').textContent.indexOf('会话 A 的第一问') >= 0,
        q('#messages').textContent);

      /* 前进:URL 换回下一格 */
      history.replaceState(null, '', '#ses_b');
      window.dispatchEvent(new PopStateEvent('popstate'));
      T('收到 popstate 后前进到下一个会话', store.selected === 'ses_b', store.selected);
      await settle(function () { return q('#messages').textContent.indexOf('会话 B 的第一问') >= 0; });
      T('跟随前进后消息也换成该会话的', q('#messages').textContent.indexOf('会话 B 的第一问') >= 0,
        q('#messages').textContent);

      /* 后退到「面板最初那一格」(无 hash):取消选中并清空对话区 */
      T('已选中时对话操作条是显示的', q('#chatOps').hidden === false);
      history.replaceState(null, '', location.pathname + location.search);
      window.dispatchEvent(new PopStateEvent('popstate'));
      T('后退到无 hash 时取消选中', store.selected === null, store.selected);
      T('取消选中后标题回到空态', q('#chatTitle').textContent === '未选择会话', q('#chatTitle').textContent);
      T('取消选中后对话区被清空', q('#messages').innerHTML === '', q('#messages').innerHTML.slice(0, 80));
      T('取消选中后发送键禁用', q('#send').disabled === true);
      T('取消选中后对话操作条隐藏', q('#chatOps').hidden === true);
      T('取消选中不清历史栈(用 replaceState)', history.length === LEN + 2, history.length);

      /* 已经在 URL 指向的会话上 / 本来就没选中:重复 popstate 是空操作 */
      store.selected = null;
      window.dispatchEvent(new PopStateEvent('popstate'));
      T('hash 为空且本来就没选中:popstate 是空操作', store.selected === null, store.selected);
      T('空操作也不入栈', history.length === LEN + 2, history.length);

      /* ============ 10. 会话内滚动位置(H 组 3) ============ */
      sessionStorage.clear();
      localStorage.removeItem('ocs.scroll');
      history.replaceState(null, '', location.pathname + location.search);
      setupScrollMemory();
      var box = q('#messages');
      await selectSession('ses_long');
      T('长会话渲染出来了', q('#messages').textContent.indexOf('第 59 条消息') >= 0);
      var maxTop = box.scrollHeight - box.clientHeight;
      T('长会话确实能滚动(否则这组测试没意义)', maxTop > 100, maxTop);
      T('不还原时是跳到底部的', box.scrollTop + box.clientHeight >= box.scrollHeight - 2,
        box.scrollTop + '+' + box.clientHeight + ' vs ' + box.scrollHeight);

      /* 滚到中间,存锚点 */
      var want = Math.round(maxTop / 2);
      box.scrollTop = want;
      saveScrollAnchor();
      var savedMap = JSON.parse(sessionStorage.getItem('ocs.scroll') || '{}');
      var A = savedMap['ses_long'];
      T('锚点存进了 sessionStorage', !!A, Object.keys(savedMap));
      T('锚点带上了「顶部可见消息 id」', !!(A && A.id), A);
      T('锚点是消息级(有 id 与偏移),不是纯像素', !!(A && typeof A.id === 'string' && typeof A.off === 'number'), A);
      T('滚动位置没写进 localStorage(不该跨标签串味)', localStorage.getItem('ocs.scroll') === null);
      T('记的是当时的滚动位置', Math.abs(A.top - want) <= 1, A.top + ' vs ' + want);

      /* 模拟刷新:重来一遍,这次带锚点 */
      location.hash = '#ses_long';
      store.selected = null;
      store.messages.clear();
      msgEls.clear();
      box.innerHTML = '';
      await restoreFromHash();
      T('刷新后回到刚才读到的位置(而不是跳到底部)', Math.abs(box.scrollTop - want) <= 2,
        box.scrollTop + ' vs ' + want);
      T('确实不在底部', box.scrollTop + box.clientHeight < box.scrollHeight - 2,
        box.scrollTop + '+' + box.clientHeight + ' vs ' + box.scrollHeight);
      T('还原后锚点被消费掉(只还原一次)', store.restoreScroll === null, store.restoreScroll);
      T('还原走的是同一套渲染(消息都在)', q('#messages').textContent.indexOf('第 0 条消息') >= 0);

      /* 从列表点进会话:仍然跳到底部看最新消息 */
      box.scrollTop = 10;
      await selectSession('ses_long');
      T('从列表点进来还是跳到底部', box.scrollTop + box.clientHeight >= box.scrollHeight - 2,
        box.scrollTop + '+' + box.clientHeight + ' vs ' + box.scrollHeight);

      /* 锚点消息已不在(被删/掉出这一页):退回像素值,不白屏不报错 */
      box.scrollTop = want;
      saveScrollAnchor();
      var dirty = JSON.parse(sessionStorage.getItem('ocs.scroll'));
      dirty['ses_long'] = { id: 'msg_gone', off: 0, top: want };
      sessionStorage.setItem('ocs.scroll', JSON.stringify(dirty));
      location.hash = '#ses_long';
      store.selected = null;
      store.messages.clear();
      msgEls.clear();
      box.innerHTML = '';
      await restoreFromHash();
      T('锚点消息不存在时退回像素值', Math.abs(box.scrollTop - want) <= 2, box.scrollTop + ' vs ' + want);

      /* 没有存档的会话:照旧跳到底部 */
      sessionStorage.clear();
      location.hash = '#ses_a';
      store.selected = null;
      store.messages.clear();
      msgEls.clear();
      box.innerHTML = '';
      await restoreFromHash();
      T('没有存档时刷新仍按老样子(短会话不滚)', box.scrollTop === 0, box.scrollTop);

      /* 存档上限:只留最近 20 个会话 */
      for (var pi = 0; pi < 25; pi++) { store.selected = 'ses_p' + pi; saveScrollAnchor(); }
      var pkeys = Object.keys(JSON.parse(sessionStorage.getItem('ocs.scroll') || '{}'));
      T('存档最多留 20 个会话', pkeys.length === 20, pkeys.length);
      T('淘汰的是最久没用过的', pkeys.indexOf('ses_p0') < 0 && pkeys.indexOf('ses_p24') >= 0, pkeys);

      /* ============ 11. 顶栏筛选/排序/搜索持久化(H 组 4) ============ */
      localStorage.clear();
      restoreFilters();
      T('没有存档时搜索为空', store.search === '', store.search);
      T('没有存档时目录为「全部」', store.directory === '' && q('#dirFilter').value === '', q('#dirFilter').value);
      T('没有存档时排序回到最近更新', store.order === 'desc' && q('#order').value === 'desc', q('#order').value);
      T('没有存档时不显示已归档', store.showArchived === false && q('#showArchived').checked === false);

      localStorage.setItem('ocs.q.search', 'lcd');
      localStorage.setItem('ocs.q.dir', '/proj/a');
      localStorage.setItem('ocs.q.order', 'asc');
      localStorage.setItem('ocs.q.archived', '1');
      restoreFilters();
      T('搜索被恢复(store 与输入框都跟上)', store.search === 'lcd' && q('#search').value === 'lcd', q('#search').value);
      T('排序被恢复', store.order === 'asc' && q('#order').value === 'asc', q('#order').value);
      T('「显示已归档」被恢复', store.showArchived === true && q('#showArchived').checked === true);
      T('工程目录被恢复进 store', store.directory === '/proj/a', store.directory);

      history.replaceState(null, '', location.pathname + location.search);
      store.selected = null;
      store.messages.clear();
      msgEls.clear();
      q('#messages').innerHTML = '';
      SESSIONS.forEach(function (s) { store.sessions.set(s.id, s); });
      renderSessions();
      var dirVals = Array.prototype.map.call(q('#dirFilter').options, function (o) { return o.value; });
      T('恢复的目录即使不在结果里也出现在下拉中(还能选回去)', dirVals.indexOf('/proj/a') >= 0, dirVals);
      T('恢复的目录在下拉里是选中态', q('#dirFilter').value === '/proj/a', q('#dirFilter').value);

      /* 改一下就存一下(setupFilters 才接线,本页自己控制接线时机) */
      setupFilters();
      q('#order').value = 'asc';
      q('#order').dispatchEvent(new Event('change'));
      T('改排序立即存下', localStorage.getItem('ocs.q.order') === 'asc', localStorage.getItem('ocs.q.order'));
      await settle(function () {
        return Array.prototype.some.call(q('#dirFilter').options, function (o) { return o.value === '/proj/b'; });
      });
      q('#dirFilter').value = '/proj/b';
      q('#dirFilter').dispatchEvent(new Event('change'));
      T('改工程目录立即存下', localStorage.getItem('ocs.q.dir') === '/proj/b', localStorage.getItem('ocs.q.dir'));
      q('#showArchived').checked = true;
      q('#showArchived').dispatchEvent(new Event('change'));
      T('勾「显示已归档」立即存下', localStorage.getItem('ocs.q.archived') === '1', localStorage.getItem('ocs.q.archived'));
      q('#showArchived').checked = false;
      q('#showArchived').dispatchEvent(new Event('change'));
      T('取消勾选也存下(空串)', localStorage.getItem('ocs.q.archived') === '', JSON.stringify(localStorage.getItem('ocs.q.archived')));
      q('#search').value = 'wayland';
      q('#search').dispatchEvent(new Event('input'));
      T('搜索框输入立即存下(不等防抖)', localStorage.getItem('ocs.q.search') === 'wayland', localStorage.getItem('ocs.q.search'));
      T('输入同时更新 store.search', store.search === 'wayland', store.search);
      T('清空搜索会存成空串(下次启动不会又冒出旧词)', (function () {
        q('#search').value = '';
        q('#search').dispatchEvent(new Event('input'));
        return localStorage.getItem('ocs.q.search') === '';
      })(), localStorage.getItem('ocs.q.search'));
      T('存的是 localStorage 而不是 sessionStorage(跨标签/跨次启动都记得)',
        sessionStorage.getItem('ocs.q.search') === null);

      document.getElementById('results').textContent = out.join('\n');
      document.title = 'FAIL=' + out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' TOTAL=' + out.length;
      post(out.join('\n'));
    } catch (e) {
      document.getElementById('results').textContent = out.join('\n');
      post(out.join('\n') + '\nPAGE-ERROR name=' + (e && e.name) + ' message=' + (e && e.message) +
           ' stack=' + (e && e.stack));
    }
  })();
  </script>
</body>
</html>
