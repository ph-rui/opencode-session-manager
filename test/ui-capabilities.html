<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>capabilities unit</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header id="topbar"><div class="brand">t</div>
    <label class="f"><span>搜索</span><input id="search"></label>
    <label class="f"><span>工程目录</span><select id="dirFilter"></select></label>
    <label class="f"><span>排序</span><select id="order"></select></label>
    <div class="lbtools">
      <button id="btnNew">+ 新建</button><button id="btnImport">导入</button><button id="refresh">刷新</button>
    </div>
    <label class="chk"><input type="checkbox" id="showArchived"> 显示已归档</label>
    <span id="count"></span><span id="archivedCount"></span>
    <div id="status" class="status"></div>
  </header>
  <main>
    <section id="listpane"><table id="list"><tbody></tbody></table><div id="listState" class="msgstate" hidden><span id="listStateText"></span><button type="button" id="lsRetry" class="chip" hidden>重试</button></div><button id="loadMore" hidden></button></section>
    <div class="resizer" id="resizer-mid"></div>
    <section id="chatpane">
      <nav id="sessionTabs" aria-label="最近打开的会话" hidden>
        <div id="tabStrip"></div>
        <button type="button" id="tabNew" title="新建会话" aria-label="新建会话">
          <span class="tnFull">+ 新建</span><span class="tnShort" aria-hidden="true">+</span>
        </button>
      </nav>
      <div id="chatHeader">
        <div class="chline"><span id="chatTitle"></span><span id="chatState"></span></div>
        <div id="chatMeta"></div>
        <div id="chatOps" hidden>
          <button type="button" id="opExport">导出</button>
          <button type="button" id="opTui">在 TUI 打开</button>
          <button type="button" id="opArchive">归档</button>
        </div>
        <button id="older" hidden></button>
      </div>
      <div id="messages"></div><div id="asks" hidden></div><div id="inbox" hidden></div>
      <div id="composer">
        <div id="ctoolbar" hidden>
          <label class="ctl"><span>智能体</span><select id="agentSel"><option value="">默认</option></select></label>
          <label class="ctl"><span>模型</span><select id="modelSel"><option value="">默认</option></select></label>
          <label class="ctl" id="variantWrap" hidden><span>变体</span><select id="variantSel"></select></label>
          <span class="ctl-spacer"></span>
          <div id="delivery" class="seg" hidden>
            <button type="button" data-delivery="queue">排队</button>
            <button type="button" data-delivery="steer">插话</button>
          </div>
          <button type="button" id="interrupt" hidden>■ 中断</button>
        </div>
        <div class="cinput"><textarea id="input"></textarea><button id="send"></button></div>
      </div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <datalist id="dirList"></datalist>

  <dialog id="dlgNew" class="dlg"><div class="dlgform"><h3>新建会话</h3>
    <input id="newDir" list="dirList"><input id="newTitle">
    <label class="chkfld"><input type="checkbox" id="newWt"><span>在 worktree 中新建</span></label>
    <div class="fldrow" id="newWtRow" hidden><input id="newWtName"><button type="button" id="newWtGen">生成</button></div>
    <p id="newWtHint" hidden></p>
    <select id="newAgent"><option value="">默认</option></select>
    <select id="newModel"><option value="">默认</option></select>
    <span id="newVariantWrap" hidden><select id="newVariant"></select></span>
    <p id="newErr" hidden></p>
    <button type="button" id="newOk">创建</button></div></dialog>

  <dialog id="dlgImport" class="dlg"><div class="dlgform"><h3>导入会话</h3>
    <input type="file" id="importFile"><input id="importDir" list="dirList">
    <p id="importErr" hidden></p>
    <button type="button" id="importOk">导入</button></div></dialog>

  <dialog id="dlgExport" class="dlg"><div class="dlgform"><h3>导出会话</h3>
    <input type="checkbox" id="exportSanitize" checked>
    <p id="exportErr" hidden></p>
    <button type="button" id="exportOk">导出</button></div></dialog>

  <dialog id="dlgTui" class="dlg"><div class="dlgform"><h3>在 TUI 中继续</h3>
    <input id="tuiCmd"><button type="button" id="tuiCopy">复制</button></div></dialog>

  <dialog id="dlgDiff" class="dlg dlgdiff"><div class="dlgform">
    <div class="diffhead"><h3>变更 <span class="diffsub" id="diffSub">最近一轮</span></h3><span class="diffstat" id="diffStat"></span></div>
    <div class="diffbar">
      <div class="seg diffsources" id="diffSources" role="tablist" aria-label="变更来源">
        <button type="button" role="tab" data-diffmode="turn" class="active" aria-selected="true">最近一轮</button>
        <button type="button" role="tab" data-diffmode="branch" aria-selected="false">全部</button>
        <button type="button" role="tab" data-diffmode="working" aria-selected="false">未提交</button>
        <button type="button" role="tab" data-diffmode="committed" aria-selected="false">已提交</button>
      </div>
      <button type="button" class="chip diffbase" id="diffBase" hidden></button>
    </div>
    <div class="diffmain">
      <div class="difftree" id="diffTree" role="group" aria-label="变更文件" hidden></div>
      <div class="diffbody" id="diffBody"></div>
    </div>
    <p class="dlgerr" id="diffErr" hidden></p>
    <div class="dlgacts"><button type="button" data-close>关闭</button><button type="button" id="diffReload">刷新</button></div>
  </div></dialog>

  <dialog id="dlgPick" class="dlg"><div class="dlgform">
    <h3 id="pickTitle">选择</h3>
    <input id="pickFilter" class="pickfilter" type="text" autocomplete="off" spellcheck="false" hidden>
    <div id="pickList" class="picklist" role="listbox"></div>
    <div class="dlgfoot" id="pickFoot"></div>
    <div class="dlgacts"><button type="button" class="chip" data-close>关闭</button></div>
  </div></dialog>

  <pre id="results"></pre>

  <script>
    /* 屏蔽 app.js 的自动 init:本测试直接调用被测函数,避免后台拉取干扰断言 */
    var __add = document.addEventListener.bind(document);
    document.addEventListener = function (t, fn, o) {
      if (t === 'DOMContentLoaded') return;
      return __add(t, fn, o);
    };

    var AGENTS = [
      { id: 'build', name: 'Build', mode: 'primary', hidden: false },
      { id: 'plan', name: 'Plan', mode: 'primary', hidden: false },
      { id: 'general', name: 'General', mode: 'subagent', hidden: false },
    ];
    var MODELS = [
      { providerID: 'p1', modelID: 'm1', name: 'M1', enabled: true, variants: [ { id: 'low' }, { id: 'high' } ] },
      { providerID: 'p2', modelID: 'm2', name: 'M2', enabled: true, variants: [] },
    ];
    var SESSIONS = [
      { id: 'ses_a', title: '活动会话', projectID: 'pj1', time: { created: 1, updated: 5 },
        tokens: { input: 1, output: 1 }, cost: 0, location: { directory: '/proj/a' } },
      { id: 'ses_b', title: '已归档会话', projectID: 'pj1', time: { created: 1, updated: 4 },
        tokens: { input: 1, output: 1 }, cost: 0, location: { directory: '/proj/a' },
        metadata: { ocs: { archived: 111 } } },
      { id: 'ses_c', title: '带其它 metadata', projectID: 'pj1', time: { created: 1, updated: 3 },
        tokens: { input: 1, output: 1 }, cost: 0, location: { directory: '/proj/b' },
        metadata: { other: { x: 1 }, ocs: { note: 'keep' } } },
    ];

    var DIFF_FILES = [
      { file: '/proj/a/a.js', status: 'modified', additions: 2, deletions: 1,
        patch: '@@ -1,3 +1,4 @@\n-let a = 1;\n+let a = 2;\n+let b = 3;\n console.log(a);' },
      { file: '/proj/a/new.txt', status: 'added', additions: 1, deletions: 0,
        patch: '@@ -0,0 +1 @@\n+hello' },
    ];

    /* 打桩:记录请求;可控制 import 首次返回 409 以验证重试 */
    window.__realFetch = window.fetch.bind(window);
    window.calls = [];
    window.importConflictOnce = false;
    window.__importSeen = 0;
    window.__blobs = [];
    window.__downloads = [];
    window.confirmMsg = null;
    window.confirm = function (msg) { window.confirmMsg = msg; return true; };
    window.__worktrees = [
      { directory: '/proj/a' },
      { directory: '/wt/one', strategy: 'git' },
      { directory: '/wt/two', strategy: 'git' },
    ];
    window.__wtListFail = false;
    window.__wtMoveFail = false;
    window.__wtDeleteForceOnce = false;
    window.__wtDeletes = [];
    window.__wtMoves = [];
    window.vcsBaseFail = false;
    window.vcsBaseData = { name: 'release', ref: 'refs/heads/release', source: 'default' };
    window.vcsBranches = ['release', 'dev', 'feature/x'];
    window.vcsDiffFail = false;
    window.vcsDiffEmpty = false;
    window.vcsDiffFiles = DIFF_FILES;
    URL.createObjectURL = function (b) { window.__blobs.push(b); return 'blob:stub'; };
    URL.revokeObjectURL = function () {};
    HTMLAnchorElement.prototype.click = function () { window.__downloads.push(this.download); };

    var json = function (obj) { return { ok: true, status: 200, text: async function () { return JSON.stringify(obj); } }; };
    var fail = function (status, obj) { return { ok: false, status: status, text: async function () { return JSON.stringify(obj); } }; };

    window.fetch = async function (url, opts) {
      var u = String(url);
      var method = (opts && opts.method) || 'GET';
      window.calls.push({ url: u, method: method, body: (opts && opts.body) || null });
      if (method === 'POST' && u === '/api/session') {
        if (window.sessionFailOnce) {
          window.sessionFailOnce = false;
          return fail(500, { message: 'network down' });
        }
        var b = JSON.parse(opts.body);
        return json({ data: { id: 'ses_new01', title: b.title || null, agent: b.agent || null,
          model: b.model || null, projectID: 'pjN', time: { created: 9, updated: 9 },
          tokens: { input: 0, output: 0 }, cost: 0, location: b.location, metadata: b.metadata } });
      }
      if (u.indexOf('/api/location?') === 0) {
        var ldir = new URL(u, 'http://x').searchParams.get('location[directory]');
        return json({ directory: ldir, project: { id: 'pjWT', directory: ldir, canonical: ldir } });
      }
      if (method === 'POST' && u === '/api/worktree') {
        if (window.wtFail) {
          return fail(400, { _tag: 'WorktreeError', name: 'WorktreeError', data: { message: 'not a git project' } });
        }
        return json({ directory: '/wt/' + JSON.parse(opts.body).name });
      }
      if (u.indexOf('/api/worktree?') === 0) {
        if (window.__wtListFail) return fail(500, { message: 'wt list boom' });
        return json(window.__worktrees);
      }
      if (method === 'POST' && u === '/api/worktree/refresh') {
        return { ok: true, status: 204, text: async function () { return ''; } };
      }
      if (method === 'DELETE' && u === '/api/worktree') {
        var wd = JSON.parse(opts.body);
        window.__wtDeletes.push(wd);
        if (window.__wtDeleteForceOnce && !wd.force) {
          window.__wtDeleteForceOnce = false;
          return fail(400, {
            _tag: 'WorktreeError', name: 'WorktreeError',
            data: { message: 'worktree has uncommitted changes', forceRequired: true },
          });
        }
        window.__worktrees = window.__worktrees.filter(function (w) { return w.directory !== wd.directory; });
        return { ok: true, status: 204, text: async function () { return ''; } };
      }
      var mv = u.match(/^\/api\/session\/([^/?]+)\/move$/);
      if (method === 'POST' && mv) {
        var mb = JSON.parse(opts.body);
        window.__wtMoves.push({ sid: decodeURIComponent(mv[1]), directory: mb.directory });
        if (window.__wtMoveFail) return fail(400, { data: { message: 'move boom' } });
        return { ok: true, status: 204, text: async function () { return ''; } };
      }
      if (u.indexOf('/api/experimental/session/import') === 0) {
        window.__importSeen++;
        if (window.importConflictOnce && window.__importSeen === 1) {
          return fail(409, { _tag: 'ConflictError', message: 'session already exists' });
        }
        var ib = JSON.parse(opts.body);
        return json({ data: { id: ib.info.id, title: ib.info.title, projectID: 'pjN',
          time: { created: 9, updated: 9 }, tokens: { input: 0, output: 0 }, cost: 0,
          location: ib.location || ib.info.location } });
      }
      var m = u.match(/^\/api\/experimental\/session\/([^/?]+)\/export/);
      if (m) {
        var sid = decodeURIComponent(m[1]);
        var san = /sanitize=true/.test(u);
        return json({ data: {
          info: { id: sid, title: san ? '[redacted:session-title:' + sid + ']' : '活动会话',
                  projectID: 'pj1', cost: 0, tokens: { input: 1, output: 1, reasoning: 0, cache: { read: 0, write: 0 } },
                  time: { created: 1, updated: 5 }, location: { directory: '/proj/a' } },
          messages: [ { id: 'm1', type: 'user', time: { created: 2 }, text: 'hello' } ],
        } });
      }
      if (u.indexOf('/api/vcs/base?') === 0) {
        if (window.vcsBaseFail) return fail(503, { message: 'Choose a review base' });
        return json({ location: { directory: '/proj/a' }, data: window.vcsBaseData });
      }
      if (u.indexOf('/api/vcs/diff?') === 0) {
        if (window.vcsDiffFail) return fail(500, { message: 'vcs diff boom' });
        return json({ location: { directory: '/proj/a' }, data: window.vcsDiffEmpty ? [] : window.vcsDiffFiles });
      }
      if (u.indexOf('/api/vcs/branch?') === 0) return json({ location: { directory: '/proj/a' }, data: window.vcsBranches });
      if (u.indexOf('/api/vcs?') === 0) {
        return json({ location: { directory: '/proj/a' }, data: { provider: 'git', branch: { current: 'dev', default: 'release' } } });
      }
      if (u.indexOf('/api/session/active') === 0) return json({ data: {} });
      var oneSession = u.match(/^\/api\/session\/([^/?]+)$/);
      if (method === 'GET' && oneSession) {
        var oneID = decodeURIComponent(oneSession[1]);
        var one = store.sessions.get(oneID) || SESSIONS.filter(function (s) { return s.id === oneID; })[0];
        return one ? json({ data: one }) : fail(404, { message: 'session not found' });
      }
      if (u.indexOf('/api/agent') === 0) return json({ data: AGENTS });
      if (u.indexOf('/api/model') === 0) return json({ data: MODELS });
      if (/^\/api\/session\/[^/?]+\/diff\?context=3$/.test(u)) {
        if (window.diffFail) return fail(500, { message: 'diff boom' });
        return json({ data: window.diffEmpty ? [] : DIFF_FILES });
      }
      if (/^\/api\/session\/[^/?]+\/(inbox|message|form|permission)/.test(u)) return json({ data: [] });
      if (u.indexOf('/api/session?') === 0) {
        if (window.listFailOnce) {
          window.listFailOnce = false;
          return fail(500, { message: 'upstream 掉了' });
        }
        return json({ data: SESSIONS, cursor: {} });
      }
      if (method === 'PATCH') return { ok: true, status: 204, text: async function () { return ''; } };
      if (method === 'POST' || method === 'DELETE') return { ok: true, status: 204, text: async function () { return ''; } };
      return json({});
    };
    window.EventSource = class { constructor() {} close() {} };
    window.setInterval = function () { return 0; };
    window.setTimeout = function () { return 0; };
  </script>
  <script src="/app.js"></script>
  <script>
  (async function () {
    var post = function (body) { try { window.__realFetch('/result', { method: 'POST', body: body }); } catch (_) {} };
    var out = [];
    var T = function (name, cond, extra) {
      out.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : ' | got=' + JSON.stringify(extra)));
    };
    var q = function (s) { return document.querySelector(s); };
    var qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
    var vals = function (sel) { return qa(sel + ' option').map(function (o) { return o.value; }); };
    var reqs = function (re) { return window.calls.filter(function (c) { return re.test(c.url); }); };
    var bodyOf = function (c) { return JSON.parse(c.body); };
    var reset = function () { window.calls.length = 0; };
    var seed = function () {
      store.sessions.clear();
      SESSIONS.forEach(function (s) { store.sessions.set(s.id, JSON.parse(JSON.stringify(s))); });
      store.selected = null;
    };
    var setFile = function (input, name, text) {
      var f = new File([text], name, { type: 'application/json' });
      try {
        var dt = new DataTransfer();
        dt.items.add(f);
        input.files = dt.files;
      } catch (_) {
        Object.defineProperty(input, 'files', { value: [f], configurable: true });
      }
      return f;
    };

    try {
      /* ---------------- 归档判定 ---------------- */
      T('未带 metadata → 未归档', isArchived({}) === false);
      T('metadata 无 ocs → 未归档', isArchived({ metadata: { other: 1 } }) === false);
      T('ocs 为空对象 → 未归档', isArchived({ metadata: { ocs: {} } }) === false);
      T('ocs.archived 有值 → 已归档', isArchived({ metadata: { ocs: { archived: 1 } } }) === true);

      /* ---------------- 列表过滤与标记 ---------------- */
      seed();
      store.showArchived = false;
      renderSessions();
      T('默认隐藏已归档会话', qa('#list tbody tr').length === 2, qa('#list tbody tr').length);
      T('已归档会话不在列表里', !q('#list tbody tr[data-id="ses_b"]'));
      T('可见计数只算未归档', q('#count').textContent === '2', q('#count').textContent);
      T('提示剩余归档数量', q('#archivedCount').textContent.indexOf('1') >= 0, q('#archivedCount').textContent);

      store.showArchived = true;
      renderSessions();
      T('勾选后显示全部会话', qa('#list tbody tr').length === 3, qa('#list tbody tr').length);
      var trb = q('#list tbody tr[data-id="ses_b"]');
      T('已归档行带 .archived 类', !!trb && trb.classList.contains('archived'));
      T('已归档行显示 📦 标记', !!trb && trb.textContent.indexOf('已归档') >= 0, trb && trb.textContent);
      T('已归档行按钮为「取消归档」',
        !!trb && trb.querySelector('button[data-act="archive"]').textContent === '取消归档',
        trb && trb.querySelector('button[data-act="archive"]').textContent);
      T('已归档行按钮带 arch-on 类', !!trb && trb.querySelector('button[data-act="archive"]').classList.contains('arch-on'));
      var tra = q('#list tbody tr[data-id="ses_a"]');
      T('未归档行按钮为「归档」', tra.querySelector('button[data-act="archive"]').textContent === '归档');
      T('未归档行无 📦 标记', !tra.querySelector('.arch-badge'));

      /* ---------------- 归档动作:PATCH 必须读-改-写整个 metadata ---------------- */
      seed();
      reset();
      await toggleArchive('ses_c'); // metadata: {other:{x:1}, ocs:{note:'keep'}}
      var cp = reqs(/^\/api\/session\/ses_c$/).filter(function (c) { return c.method === 'PATCH'; })[0];
      T('归档 PATCH 到 /api/session/:id', !!cp, cp && cp.url);
      var meta = cp && bodyOf(cp).metadata;
      T('归档保留其它 metadata 命名空间', !!meta && meta.other && meta.other.x === 1, meta);
      T('归档保留 ocs 下已有键', !!meta && meta.ocs && meta.ocs.note === 'keep', meta);
      T('归档写入 ocs.archived 时间戳', !!meta && typeof meta.ocs.archived === 'number', meta);
      T('归档后内存中的会话被标记', isArchived(store.sessions.get('ses_c')) === true);
      T('归档确认有提示文案', typeof confirmMsg === 'string' && confirmMsg.indexOf('归档') >= 0, confirmMsg);

      seed();
      reset();
      await toggleArchive('ses_b'); // 只有 ocs.archived → 取消归档后 metadata 应为空对象
      var cu = reqs(/^\/api\/session\/ses_b$/).filter(function (c) { return c.method === 'PATCH'; })[0];
      T('取消归档 PATCH metadata 为空', !!cu && JSON.stringify(bodyOf(cu).metadata) === '{}', cu && bodyOf(cu));
      T('取消归档后内存中不再标记', isArchived(store.sessions.get('ses_b')) === false);

      seed();
      reset();
      var origConfirm = window.confirm;
      window.confirm = function (m) { window.confirmMsg = m; return false; };
      await toggleArchive('ses_a');
      T('确认框取消则不发请求', reqs(/PATCH/).length === 0);
      window.confirm = origConfirm;

      /* ---------------- 聊天头部操作按钮 ---------------- */
      seed();
      store.selected = 'ses_a';
      renderChatOps();
      T('选中会话时显示操作区', q('#chatOps').hidden === false);
      T('未归档时按钮为「归档」', q('#opArchive').textContent === '归档');
      store.selected = 'ses_b';
      renderChatOps();
      T('已归档时按钮为「取消归档」', q('#opArchive').textContent === '取消归档');
      T('已归档时按钮高亮', q('#opArchive').classList.contains('arch-on'));
      store.selected = null;
      renderChatOps();
      T('未选会话时隐藏操作区', q('#chatOps').hidden === true);

      /* 选中了、但这个会话不在 store.sessions 里(深链 / 列表那一页还没送到它):
         这一栏照样得在 —— 改前它会整排永远藏起来(§8.39) */
      store.selected = 'ses_ghost';
      renderChatOps();
      T('选中会话不在列表页里也显示操作区', q('#chatOps').hidden === false);
      T('拿不到会话信息时先按「归档」画(等 refreshSessionInfo 校正)', q('#opArchive').textContent === '归档',
        q('#opArchive').textContent);
      T('拿不到会话信息时清掉上一个会话的「已归档」高亮', q('#opArchive').classList.contains('arch-on') === false);

      /* ---------------- 新建会话 ---------------- */
      q('#newDir').value = '/proj/a';
      await fillNewSelectors();
      T('新建:agent 下拉按规则过滤', JSON.stringify(vals('#newAgent')) === JSON.stringify(['', 'build', 'plan']), vals('#newAgent'));
      T('新建:model 下拉按 provider 分组',
        qa('#newModel optgroup').map(function (g) { return g.label; }).join(',') === 'p1,p2',
        qa('#newModel optgroup').map(function (g) { return g.label; }));

      seed();
      store.selected = null;
      reset();
      q('#newDir').value = '/proj/new';
      await fillNewSelectors();
      q('#newTitle').value = '新建标题';
      q('#newAgent').value = 'plan';
      q('#newModel').value = 'p1/m1';
      // 与真实的 change 处理一致:换模型后重算变体下拉
      paintVariant(q('#newVariantWrap'), q('#newVariant'), q('#newModel').value);
      q('#newVariant').value = 'high';
      q('#newErr').hidden = true;
      await submitNew();
      var cn = reqs(/^\/api\/session$/).filter(function (c) { return c.method === 'POST'; })[0];

        !!listState && listState.parentElement === q('#listpane') &&
        listState.nextElementSibling === q('#loadMore'));
      T('默认收着(平时一个像素都不占)', listState.hidden === true);
      T('带 .msgstate、重试是个 .chip(窄屏自动拿到 44px 命中区)',
        listState.classList.contains('msgstate') &&
        lsRetry.tagName === 'BUTTON' && lsRetry.classList.contains('chip'));
      var addL = 0;
      var origL = lsRetry.addEventListener.bind(lsRetry);
      lsRetry.addEventListener = function () { addL++; return origL.apply(null, arguments); };
      setupListState();
      lsRetry.addEventListener = origL;
      T('重复接线不再挂监听(init 会被反复调)', addL === 0, addL);

      reset();
      window.listFailOnce = true;
      store.listError = '';
      store.listLoading = false;
      await loadSessions({ reset: true });
      T('拉列表失败时状态行露出来、带原因',
        listState.hidden === false &&
        listText.textContent === '加载失败:upstream 掉了', listText.textContent);
      T('失败时状态行标成 .bad(照 #msgState 的红色)',
        listState.classList.contains('bad') === true);
      T('失败时「重试」露出来', lsRetry.hidden === false);
      T('失败没把 store.listError 丢了(切走再回来还看得见)', store.listError === 'upstream 掉了',
        store.listError);

      reset();
      lsRetry.click();
      await drain(8);
      T('点重试重新拉了一遍列表(从头拉:reset)',
        reqs(/^\/api\/session\?/).length === 1 && !/cursor=/.test(window.calls[window.calls.length - 1].url),
        reqs(/^\/api\/session\?/).map(function (c) { return c.url; }));
      T('拉成功了那条话自己收起来、重试跟着藏',
        listState.hidden === true && lsRetry.hidden === true && store.listError === '');
      T('(复原)列表照旧填回去了', store.sessions.size === SESSIONS.length, store.sessions.size);

      /* ---------------- §8.59 最近会话标签栏 ----------------
       * 打开会话自动进 tab;点 tab 直切;× 只移出 tab、不删会话;关当前 tab 自动切邻居;
       * 最多 8 个;存 localStorage;手机也显示。 */
      setupSessionTabs();
      var nav = q('#sessionTabs');
      var strip = q('#tabStrip');
      var resetTabs = function () {
        try { localStorage.removeItem('ocs.tabs'); } catch (_) {}
        store.tabs = [];
        store.selected = null;
        tabsSig = '';
        tabsActiveSeen = null;
        renderTabs();
      };
      T('标签栏在聊天区顶部、标题头之前',
        nav.parentElement === q('#chatpane') && nav.nextElementSibling === q('#chatHeader'));
      resetTabs();
      T('没有标签时整条收起来(不占高度)', nav.hidden === true && strip.children.length === 0);

      /* 读回:去重、丢坏项、最多 8 个 */
      localStorage.setItem('ocs.tabs', JSON.stringify([
        { id: 'ses_a', title: 'A' }, { id: 'ses_a', title: 'A2' },
        { id: '' }, null, { id: 'ses_b', title: 'B' },
      ]));
      var rt = readTabs();
      T('读回标签时去重、丢掉空/坏项',
        rt.length === 2 && rt[0].id === 'ses_a' && rt[1].id === 'ses_b', rt);
      var many = [];
      for (var ti = 0; ti < 12; ti++) many.push({ id: 'ses_t' + ti, title: 'T' + ti });
      localStorage.setItem('ocs.tabs', JSON.stringify(many));
      rt = readTabs();
      T('读回标签最多留 8 个(最近的)',
        rt.length === 8 && rt[7].id === 'ses_t11', rt.map(function (t) { return t.id; }));

      resetTabs();
      seed();
      touchTab('ses_a');
      T('打开会话自动进标签,标题取会话列表',
        store.tabs.length === 1 && store.tabs[0].id === 'ses_a' && store.tabs[0].title === '活动会话', store.tabs);
      T('有标签后整条露出来', nav.hidden === false && qa('#tabStrip .tab').length === 1);
      T('标题过长的省略交给 CSS(.tabtitle)', !!strip.querySelector('.tabtitle'));
      touchTab('ses_a');
      T('重复打开同一个会话不会多一个标签', store.tabs.length === 1, store.tabs);
      T('没选中时不高亮', !strip.querySelector('.tab.active'));

      store.tabs = [];
      store.selected = null;
      tabsSig = '';
      tabsActiveSeen = null;
      renderTabs();
      store.msgCache.clear();
      await selectSession('ses_a');
      T('选中会话后标签高亮、aria-current 指到当前会话',
        !!strip.querySelector('.tab.active[data-id="ses_a"]') &&
        strip.querySelector('.tab.active .tabmain').getAttribute('aria-current') === 'page');
      await selectSession('ses_b');
      T('第二个会话按打开顺序追加',
        store.tabs.map(function (t) { return t.id; }).join(',') === 'ses_a,ses_b', store.tabs);
      T('当前标签跟着切到第二个',
        strip.querySelector('.tab.active').dataset.id === 'ses_b');

      strip.querySelector('.tab[data-id="ses_a"] .tabmain').click();
      T('点标签直接切会话(当前标签同步)',
        store.selected === 'ses_a' && strip.querySelector('.tab.active').dataset.id === 'ses_a');

      var delBefore = window.calls.filter(function (c) { return c.method === 'DELETE'; }).length;
      strip.querySelector('.tab[data-id="ses_b"] .tabx').click();
      T('关闭非当前标签:只移出标签栏,不删会话也不切会话',
        !store.tabs.some(function (t) { return t.id === 'ses_b'; }) &&
        store.sessions.has('ses_b') && store.selected === 'ses_a', store.tabs);
      T('关闭标签不发 DELETE',
        window.calls.filter(function (c) { return c.method === 'DELETE'; }).length === delBefore);

      await selectSession('ses_b');
      strip.querySelector('.tab[data-id="ses_b"] .tabx').click();
      T('关掉当前标签:自动切到左/右邻居',
        !store.tabs.some(function (t) { return t.id === 'ses_b'; }) && store.selected === 'ses_a',
        { tabs: store.tabs, sel: store.selected });

      strip.querySelector('.tab[data-id="ses_a"] .tabx').click();
      T('关掉最后一个标签:回到未选择、整条收起',
        store.tabs.length === 0 && store.selected === null && nav.hidden === true);

      /* 最多 8 个,丢最旧的;写盘 */
      store.tabs = [];
      store.selected = null;
      tabsSig = '';
      tabsActiveSeen = null;
      renderTabs();
      for (var tj = 0; tj < 10; tj++) touchTab('ses_x' + tj, 'X' + tj);
      T('最多留 8 个,超出丢最旧的那个',
        store.tabs.length === 8 && store.tabs[0].id === 'ses_x2' && store.tabs[7].id === 'ses_x9',
        store.tabs.map(function (t) { return t.id; }));
      var persisted = JSON.parse(localStorage.getItem('ocs.tabs'));
      T('标签写进 localStorage(只存 id + 标题)',
        persisted.length === 8 && persisted[0].id === 'ses_x2' && persisted[0].title === 'X2', persisted[0]);

      seed();
      store.tabs = [{ id: 'ses_a', title: '旧标题' }];
      store.selected = null;
      tabsSig = '';
      tabsActiveSeen = null;
      saveTabs();
      renderTabs();
      store.sessions.get('ses_a').title = '新标题';
      renderTabs();
      T('会话列表里的新标题会同步到标签并回写',
        strip.querySelector('.tabtitle').textContent === '新标题' &&
        JSON.parse(localStorage.getItem('ocs.tabs'))[0].title === '新标题');

      q('#tabNew').click();
      T('「+ 新建」复用现有新建框', q('#dlgNew').open === true);
      closeDlg(q('#dlgNew'));

      document.documentElement.classList.add('narrow', 'view-chat');
      store.tabs = [{ id: 'ses_a', title: 'A' }, { id: 'ses_b', title: 'B' }];
      store.selected = 'ses_a';
      tabsSig = '';
      tabsActiveSeen = null;
      renderTabs();
      var tabA = strip.querySelector('.tab[data-id="ses_a"]');
      var tabB = strip.querySelector('.tab[data-id="ses_b"]');
      T('窄屏:标签栏 34px(横屏 30px 由 html.short 再收)',
        Math.round(nav.getBoundingClientRect().height) === 34, nav.getBoundingClientRect().height);
      T('窄屏:「+ 新建」只留一个加号',
        getComputedStyle(q('#tabNew .tnShort')).display !== 'none' &&
        getComputedStyle(q('#tabNew .tnFull')).display === 'none',
        { short: getComputedStyle(q('#tabNew .tnShort')).display,
          full: getComputedStyle(q('#tabNew .tnFull')).display });
      T('窄屏:只有当前标签露 ×',
        getComputedStyle(tabA.querySelector('.tabx')).display === 'flex' &&
        getComputedStyle(tabB.querySelector('.tabx')).display === 'none');
      document.documentElement.classList.remove('narrow', 'view-chat');

      /* ---- §8.61 worktree 管理(列出 / 删除 / 移入) ---- */
      var WTS = [
        { directory: '/proj/a' },
        { directory: '/wt/one', strategy: 'git' },
        { directory: '/wt/two', strategy: 'git' },
      ];
      var resetWt = function () {
        seed();
        store.selected = 'ses_a';
        window.__worktrees = WTS.map(function (w) { return { directory: w.directory, strategy: w.strategy }; });
        window.__wtListFail = false;
        window.__wtMoveFail = false;
        window.__wtDeleteForceOnce = false;
        window.__wtDeletes = [];
        window.__wtMoves = [];
        window.confirmMsg = null;
        closePick();
        reset();
      };
      var wtLabels = function () {
        return qa('#pickList .pi-label').map(function (el) { return el.textContent; });
      };
      var wtItem = function (dir) {
        return store.pickItems.filter(function (it) { return it.key === dir; })[0];
      };

      var wtCmd = PANEL_COMMANDS.filter(function (c) { return c.name === 'worktrees'; })[0];
      T('/worktrees 进命令面板', !!wtCmd && wtCmd.description.indexOf('工作树') >= 0, wtCmd);

      resetWt();
      await openWorktrees();
      var wtRefresh = reqs(/^\/api\/worktree\/refresh$/);
      var wtList = reqs(/^\/api\/worktree\?/);
      T('打开工作树:先 refresh 再按 projectID 列',
        wtRefresh.length === 1 && bodyOf(wtRefresh[0]).projectID === 'pj1' &&
        wtList.length === 1 && /projectID=pj1/.test(wtList[0].url),
        { refresh: wtRefresh, list: wtList });
      T('工作树对话框标题带会话名、当前根标 ●',
        q('#dlgPick').open === true &&
        q('#pickTitle').textContent.indexOf('工作树') === 0 &&
        !!q('#pickList .pick-item.current') &&
        q('#pickList .pick-item.current .pi-label').textContent === '/proj/a',
        { title: q('#pickTitle').textContent, cur: q('#pickList .pick-item.current .pi-label') });
      T('当前根排最前,其余主检出在前、worktree 在后',
        wtLabels().join('|') === '/proj/a|/wt/one|/wt/two', wtLabels());

      pickChoose(wtItem('/wt/one'));
      T('点工作树打开动作菜单:移入 / 删除 / 刷新',
        q('#pickTitle').textContent.indexOf('/wt/one') >= 0 &&
        qa('#pickList .pi-label').map(function (el) { return el.textContent; }).join('|') ===
          '把当前会话移到这里|删除工作树|刷新工作树列表',
        { title: q('#pickTitle').textContent, labels: wtLabels() });
      await pickChoose(store.pickItems[0]);
      T('移入:POST session/move,目录沿用该工作树',
        window.__wtMoves.length === 1 &&
        window.__wtMoves[0].sid === 'ses_a' && window.__wtMoves[0].directory === '/wt/one' &&
        store.sessions.get('ses_a').location.directory === '/wt/one' &&
        q('#toast').textContent.indexOf('已移动到') >= 0,
        { moves: window.__wtMoves, loc: store.sessions.get('ses_a').location });

      resetWt();
      await openWorktrees();
      pickChoose(wtItem('/proj/a'));
      var mainAct = store.pickItems;
      T('主检出:删除项禁用,当前目录的移入项也禁用',
        mainAct[0].disabled === true && mainAct[1].disabled === true &&
        mainAct[1].sub === '主检出不能删',
        mainAct);
      closePick();

      resetWt();
      await openWorktrees();
      pickChoose(wtItem('/wt/one'));
      await pickChoose(store.pickItems[1]);
      T('删除工作树:确认前不发 force,DELETE 带 projectID + 目录',
        window.__wtDeletes.length === 1 &&
        window.__wtDeletes[0].projectID === 'pj1' &&
        window.__wtDeletes[0].directory === '/wt/one' &&
        window.__wtDeletes[0].force === false && window.confirmMsg === null,
        { deletes: window.__wtDeletes, confirm: window.confirmMsg });
      T('删除后重新列,列表里不再有它',
        q('#dlgPick').open === true && wtLabels().indexOf('/wt/one') < 0, wtLabels());

      resetWt();
      window.__wtDeleteForceOnce = true;
      await openWorktrees();
      pickChoose(wtItem('/wt/one'));
      await pickChoose(store.pickItems[1]);
      T('有未提交改动:先 confirm,再带 force=true 重试',
        window.__wtDeletes.length === 2 &&
        window.__wtDeletes[0].force === false && window.__wtDeletes[1].force === true &&
        window.confirmMsg && window.confirmMsg.indexOf('未提交改动') >= 0 &&
        wtLabels().indexOf('/wt/one') < 0,
        { deletes: window.__wtDeletes, confirm: window.confirmMsg });

      resetWt();
      store.sessions.get('ses_a').location.directory = '/wt/one';
      await openWorktrees();
      pickChoose(wtItem('/wt/one'));
      await pickChoose(store.pickItems[1]);
      T('删掉当前会话所在工作树:清空选中并回列表',
        store.selected === null && q('#dlgPick').open === false &&
        q('#toast').textContent.indexOf('已回到列表') >= 0,
        { sel: store.selected, toast: q('#toast').textContent });

      resetWt();
      store.selected = null;
      await openWorktrees();
      T('没打开会话时只提示,不发工作树请求',
        q('#toast').textContent.indexOf('先打开一个会话') >= 0 &&
        reqs(/\/api\/worktree/).length === 0,
        { toast: q('#toast').textContent, calls: window.calls });

      resetWt();
      window.__wtListFail = true;
      await openWorktrees();
      T('工作树列表失败:报服务端原话,不弹空框',
        q('#toast').textContent.indexOf('工作树列表加载失败') >= 0 &&
        q('#toast').textContent.indexOf('wt list boom') >= 0 &&
        q('#dlgPick').open === false,
        { toast: q('#toast').textContent, open: q('#dlgPick').open });

      resetWt();
      window.__wtMoveFail = true;
      await openWorktrees();
      pickChoose(wtItem('/wt/one'));
      await pickChoose(store.pickItems[0]);
      T('移入失败:报服务端原话,本地目录不动',
        q('#toast').textContent.indexOf('移动会话失败') >= 0 &&
        q('#toast').textContent.indexOf('move boom') >= 0 &&
        store.sessions.get('ses_a').location.directory === '/proj/a',
        { toast: q('#toast').textContent, loc: store.sessions.get('ses_a').location });

      document.getElementById('results').textContent = out.join('\n');
      document.title = 'FAIL=' + out.filter(function (l) { return l.indexOf('FAIL') === 0; }).length + ' TOTAL=' + out.length;
      post(out.join('\n'));
    } catch (e) {
      post('PAGE-ERROR name=' + (e && e.name) + ' message=' + (e && e.message) + ' stack=' + (e && e.stack));
    }
  })();
  </script>
</body>
</html>
