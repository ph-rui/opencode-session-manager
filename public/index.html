<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode 会话管理器</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">OpenCode 会话管理器</div>
    <div id="status" class="status">连接中…</div>
  </header>

  <main>
    <aside id="filters">
      <label>搜索
        <input id="search" type="search" placeholder="标题关键字…" autocomplete="off">
      </label>
      <label>工程目录
        <select id="dirFilter"><option value="">全部</option></select>
      </label>
      <label>排序
        <select id="order">
          <option value="desc">最近更新</option>
          <option value="asc">最早更新</option>
        </select>
      </label>
      <button id="refresh">刷新</button>
      <div class="hint">共 <span id="count">0</span> 个会话</div>
    </aside>

    <div class="resizer" id="resizer-left" title="拖动调整宽度 · 双击复位"></div>

    <section id="listpane">
      <table id="list">
        <thead>
          <tr>
            <th>标题</th>
            <th>工程目录</th>
            <th>更新</th>
            <th>Tokens</th>
            <th>Cost</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="loadMore" hidden>加载更多…</button>
    </section>

    <div class="resizer" id="resizer-mid" title="拖动调整宽度 · 双击复位"></div>

    <section id="chatpane">
      <div id="chatHeader">
        <div class="chline">
          <span id="chatTitle">未选择会话</span>
          <span id="chatState" class="state"></span>
        </div>
        <div id="chatMeta" class="meta"></div>
        <button id="older" hidden>加载更旧消息</button>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <textarea id="input" rows="2" placeholder="输入消息,Enter 发送(Shift+Enter 换行)"></textarea>
        <button id="send">发送</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
